name: Set up the build
description: >-
  JDK 21, the Android SDK, Gradle, and optionally CMake, the download caches and the Robolectric
  runtimes: what every workflow's job runs Gradle with (after actions/checkout, with fetch-depth 0:
  build-logic runs `git describe` at configuration). The caches' paths and keys live here alone: a
  path is part of what finds a cache, so two copies drifting apart would miss each other silently.

inputs:
  cmake:
    description: "Install CMake at Versions.defaultCMake (the app tests read the engine's data, unpacked with it)"
    default: "false"
  downloads:
    description: >-
      The engine data's downloads (libime's sources, the models, some 500 MB): "restore" reads the cache
      engine_downloads.yml saves on main, "save" saves it too at the job's end; empty: none
    default: ""
  handwriting:
    description: "With downloads: the handwriting models and onnxruntime too (the builds that make the APK or the text pack)"
    default: "false"
  lookup-only:
    description: "With downloads: only look the caches up (engine_downloads.yml, which downloads what is missing)"
    default: "false"
  robolectric:
    description: "A cache key prefix for Robolectric's android-all jars (one per job: each fetches its own SDKs'); empty: none"
    default: ""
  npm:
    description: "Cache ~/.npm (only the job that runs lib/keyboard-scene's JS tests: another would save an empty cache under the same key first)"
    default: "false"

outputs:
  downloads-hit:
    description: "The engine data's cache was found (exact key)"
    value: ${{ steps.downloads-save.outputs.cache-hit || steps.downloads-restore.outputs.cache-hit }}
  handwriting-hit:
    description: "The handwriting cache was found (exact key)"
    value: ${{ steps.handwriting-save.outputs.cache-hit || steps.handwriting-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # JDK 21, like the jobs that build APKs (pull_request, emulator_test) and the one the screenshot
    # goldens are recorded on
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: "temurin"
        java-version: "21"

    - name: Setup Android environment
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - name: Install CMake
      if: inputs.cmake == 'true'
      shell: bash
      run: |
        cmake=$(sed -n 's/.*defaultCMake = "\([^"]*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
        sdkmanager --install "cmake;${cmake:?no defaultCMake in Versions.kt}"

    # the engine data's downloads, keyed on EngineDataPlugin, which names them and their SHA-256; saved on
    # main by engine_downloads.yml, where a new pull request's first run finds it. The handwriting
    # models and onnxruntime have a cache of their own, keyed on the two files that name them.
    # Each pair (save, restore) has the same path and key, side by side: the one place they are written
    - name: Cache engine data downloads
      id: downloads-save
      if: inputs.downloads == 'save'
      uses: actions/cache@v6
      with:
        path: |
          .gradle/engine-downloads
          !.gradle/engine-downloads/voice
          !.gradle/engine-downloads/handwriting
          !.gradle/engine-downloads/onnxruntime-android-*.zip
        key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Restore engine data downloads
      id: downloads-restore
      if: inputs.downloads == 'restore'
      uses: actions/cache/restore@v6
      with:
        path: |
          .gradle/engine-downloads
          !.gradle/engine-downloads/voice
          !.gradle/engine-downloads/handwriting
          !.gradle/engine-downloads/onnxruntime-android-*.zip
        key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Cache handwriting downloads
      id: handwriting-save
      if: inputs.downloads == 'save' && inputs.handwriting == 'true'
      uses: actions/cache@v6
      with:
        path: |
          .gradle/engine-downloads/handwriting
          .gradle/engine-downloads/onnxruntime-android-*.zip
        key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Restore handwriting downloads
      id: handwriting-restore
      if: inputs.downloads == 'restore' && inputs.handwriting == 'true'
      uses: actions/cache/restore@v6
      with:
        path: |
          .gradle/engine-downloads/handwriting
          .gradle/engine-downloads/onnxruntime-android-*.zip
        key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}
        lookup-only: ${{ inputs.lookup-only }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # lib/keyboard-scene's JS tests install their runner with npm (kotlin.js.yarn=false), into npm's
    # own cache, which the Gradle cache does not cover; the lock pins what is installed
    - name: Cache npm
      if: inputs.npm == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ hashFiles('kotlin-js-store/package-lock.json') }}
        restore-keys: npm-

    # Robolectric fetches its android-all jars (hundreds of MB, one per SDK the tests run at)
    # into the Maven local repository, which the Gradle cache does not cover
    - name: Cache Robolectric runtimes
      if: inputs.robolectric != ''
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository/org/robolectric
        key: ${{ inputs.robolectric }}-${{ hashFiles('gradle/libs.versions.toml', 'app/src/test/resources/robolectric.properties') }}
        restore-keys: ${{ inputs.robolectric }}-
