name: Emulator Tests

# Instrumented tests on an emulator: HostTest (the Kotlin host and engine on the device) and SoftKeyboardTest
# (typing on the real keyboard into a real EditText), and VoiceEngineTest (the voice pack's models on a
# recording). The app carries no dictionaries or models: the two resource packs (test-key signed,
# which debug builds trust) are imported through the debug build's shell-only provider first, as
# uat/tools/uat.py's `packs` does. They need an APK and a device, so they take
# far longer than the JVM unit tests and do not gate every push: they run weekly, on demand,
# and on pull requests labelled `emulator`.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  emulator_test:
    name: Instrumented tests (API ${{ matrix.api }})
    # on a labelled PR: its pushes, and the `emulator` label itself being added (not other labels)
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'emulator') &&
      (github.event.action != 'labeled' || github.event.label.name == 'emulator'))
    # on the job, not the workflow: a run for some other label joins no group, so it cannot
    # cancel one in progress. A group per API level, or they would cancel each other
    concurrency:
      group: emulator-test-${{ matrix.api }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        # 29: minSdk, Android 10, which must keep working (0.5.1 crashed there)
        api:
          - 35
          - 29
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # one ABI, the emulator's, instead of all four
      BUILD_ABI: x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # CMake at the build's own version (Versions.defaultCMake)
      - name: Install build dependencies
        run: |
          cmake=$(sed -n 's/.*defaultCMake = "\([^"]*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
          sdkmanager --install "cmake;${cmake:?no defaultCMake in Versions.kt}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # as pull_request.yml's
      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
            !.gradle/engine-downloads/handwriting
            !.gradle/engine-downloads/onnxruntime-android-*.zip
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}

      - name: Cache handwriting downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads/handwriting
            .gradle/engine-downloads/onnxruntime-android-*.zip
          key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}

      - name: Cache voice model downloads
        uses: actions/cache@v6
        with:
          path: .gradle/engine-downloads/voice
          key: voice-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/VoiceDataPlugin.kt') }}

      - name: Build the app and its tests
        run: ./gradlew --build-cache :app:assembleDebug :app:assembleDebugAndroidTest :app:packs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # one line a command: the runner runs each on its own. The packs before the tests, which
          # need them; installDebug installs what was built above
          script: |
            ./gradlew --build-cache :app:installDebug
            for f in app/build/packs/*.youmopack; do n=$(basename $f); adb shell content write --uri content://io.github.sraw.youmo.debug.uat.packs/$n < $f && adb shell content call --uri content://io.github.sraw.youmo.debug.uat.packs --method import --arg $n; done
            adb shell content call --uri content://io.github.sraw.youmo.debug.uat.packs --method state | grep -q 'text=v' && adb shell content call --uri content://io.github.sraw.youmo.debug.uat.packs --method state | grep -q 'voice=v'
            ./gradlew --build-cache :app:connectedDebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-report-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
