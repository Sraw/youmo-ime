name: Emulator Tests

# Instrumented tests on an emulator: FcitxTest (the engine through JNI) and SoftKeyboardTest
# (typing on the real keyboard into a real EditText), in both builds, and in the voice one
# VoiceEngineTest (the packaged models on a recording). They need the native build, so they take
# far longer than the JVM unit tests and do not gate every push: they run weekly, on demand,
# and on pull requests labelled `emulator`.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:
    types:
      - labeled
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  emulator_test:
    name: Instrumented tests (API 35, ${{ matrix.flavor }})
    # on a labelled PR: its pushes, and the `emulator` label itself being added (not other labels)
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'emulator') &&
      (github.event.action != 'labeled' || github.event.label.name == 'emulator'))
    # on the job, not the workflow: a run for some other label joins no group, so it cannot
    # cancel one in progress. A group per flavour, or the two would cancel each other
    concurrency:
      group: emulator-test-${{ matrix.flavor }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        flavor:
          - Text
          - Voice
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # one ABI, the emulator's, instead of all four
      BUILD_ABI: x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # CMake at the build's own version (Versions.defaultCMake)
      - name: Install build dependencies
        run: |
          cmake=$(sed -n 's/.*defaultCMake = "\([^"]*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
          sdkmanager --install "cmake;${cmake:?no defaultCMake in Versions.kt}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # as pull_request.yml's
      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
            !.gradle/engine-downloads/handwriting
            !.gradle/engine-downloads/onnxruntime-android-*.zip
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}

      - name: Cache handwriting downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads/handwriting
            .gradle/engine-downloads/onnxruntime-android-*.zip
          key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}

      - name: Cache voice model downloads
        if: matrix.flavor == 'Voice'
        uses: actions/cache@v6
        with:
          path: .gradle/engine-downloads/voice
          key: voice-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/VoiceDataPlugin.kt') }}

      - name: Build the app and its tests
        run: ./gradlew --build-cache :app:assemble${{ matrix.flavor }}Debug :app:assemble${{ matrix.flavor }}DebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --build-cache :app:connected${{ matrix.flavor }}DebugAndroidTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-test-report-${{ matrix.flavor }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
