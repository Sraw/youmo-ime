name: Engine Data Downloads

# The engine data a build downloads (libime's sources, the engine-data release's model and words,
# the strokes, English's model, the sentence models: some 500 MB), cached on main: a pull
# request's run reads the caches of its own branch and of main alone, so without one saved on
# main each new pull request fetched it all again. The key is EngineDataPlugin's hash: run as it
# changes on main, the downloads alone and no build (the whole release on every push to main was
# why nix.yml, which saved it before, went). GitHub drops a cache unread for 7 days: read twice a
# week, it outlives a quiet one. The handwriting models and onnxruntime (some 75 MB, both builds)
# have a cache of their own, keyed on HandwritingDataPlugin and lib/handwriting's build, which name
# them: in the engine cache's path alone, which an exact hit never saves again, every run fetched them.

on:
  push:
    branches:
      - main
    paths:
      - build-logic/convention/src/main/kotlin/EngineDataPlugin.kt
      - build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt
      - lib/handwriting/build.gradle.kts
      # its caches' paths are part of what finds them: a change to them needs caches saved anew
      - .github/workflows/engine_downloads.yml
  schedule:
    - cron: "41 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine_downloads:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          # full history: build-logic runs `git describe` at configuration. No submodules, as
          # unit_test.yml's: the app configures without them, and the downloads need none
          fetch-depth: 0
          submodules: false

      # as pull_request.yml's; only looked up, and saved at the end where it was missing. The
      # scheduled run restores it, a read for certain to GitHub's 7 days, which a lookup may not be
      - name: Cache engine data downloads
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
            !.gradle/engine-downloads/handwriting
            !.gradle/engine-downloads/onnxruntime-android-*.zip
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}
          lookup-only: ${{ github.event_name != 'schedule' }}

      # as pull_request.yml's, looked up and saved as the engine cache is
      - name: Cache handwriting downloads
        id: handwriting
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads/handwriting
            .gradle/engine-downloads/onnxruntime-android-*.zip
          key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}
          lookup-only: ${{ github.event_name != 'schedule' }}

      - name: Setup Java
        if: steps.cache.outputs.cache-hit != 'true' || steps.handwriting.outputs.cache-hit != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android environment
        if: steps.cache.outputs.cache-hit != 'true' || steps.handwriting.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        if: steps.cache.outputs.cache-hit != 'true' || steps.handwriting.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # EngineDataPlugin's downloads, each checked against its SHA-256: downloadEngineData depends on
      # every one it registers, so one it adds is fetched and cached too
      - name: Download engine data
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew :app:downloadEngineData

      # the handwriting release's archive and the onnxruntime archive, SHA-256 checked as those are
      - name: Download handwriting data
        if: steps.handwriting.outputs.cache-hit != 'true'
        run: ./gradlew :app:downloadHandwritingModels :lib:handwriting:downloadOnnxruntime
