name: Unit Tests

# JVM unit tests, the lexicon tools' Python tests, and the C++ tests of our sherpa-onnx changes,
# built with the host's compiler (lib/sherpa-onnx/host-test.sh).
# Deliberately separate from the build workflow:
#   - no NDK (the task graph for `:app:testDebugUnitTest` contains no native tasks)
#   - single OS
# so it gates every push.
# Three jobs side by side, each on a runner of its own (one in a row took 30 minutes): the plain JVM
# modules and the tools, the app's tests at SDK 35, the same at 29. The app's
# KeyMarksEverywhereUatTest (half an app run's time) is left out of the app jobs (-PskipExhaustive)
# and run by key_marks.yml, when the keys' code changes and weekly.
#
# JDK 21 (.github/actions/setup-build), like the jobs that build APKs here (pull_request,
# emulator_test) and the one the screenshot goldens are recorded on. The Android modules target 21
# (Versions.java in build-logic/convention/src/main/kotlin/Versions.kt); lib/ime-core stays on the
# Java 11 API.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request makes an in-flight run pointless, so a PR shares one group and
# cancels. A push to main gets a group of its own (per commit): a shared group would still
# drop queued runs beyond the first, and with them the results of commits in a burst.
concurrency:
  group: unit-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  core:
    name: Core, tools and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          # full history like pull_request.yml: build-logic runs `git describe` at configuration
          fetch-depth: 0
          submodules: false

      - name: Set up the build
        uses: ./.github/actions/setup-build

      # :lib:ime-core is a plain JVM module: no Android SDK, no resource merging, seconds to
      # run. `check` = tests, the Android API level guard (animal-sniffer, which Android lint cannot
      # provide for a JVM module) and the coverage floors (Kover). :lib:ime-dict-tool, the host tool
      # that builds the engine's data, is plain JVM too; its tests are what covers the mix and the
      # crawl, whose output builds download. Its coverage is reported, with no floor.
      # :lib:ime-eval, the evaluation harness, is a third: its tests drive ime-core's engine API and
      # fail while the sets made from data/pinyin.tsv have not been remade after it changed. Its uatTest
      # source set (the UAT cases replayed on the JVM) is only compiled: running it needs the app's data.
      # :build-logic:convention's tests are the build plugins' own (the data's fingerprints and
      # hashes, detekt's sources).
      # :lib:keyboard-scene, the keyboard's drawing engine (Kotlin Multiplatform): `check` runs its
      # tests on the JVM and on node (the JS build, node fetched by Gradle, SHA-256 checked), the
      # scene snapshots compared on both, the API level guard and the coverage floors on the JVM.
      # --continue: the coverage report is wanted most when a check has failed
      - name: Run core logic, drawing engine, dict tool and evaluation tests, API level check and coverage floors
        run: ./gradlew --build-cache --continue :lib:ime-core:check :lib:ime-core:koverHtmlReport :lib:keyboard-scene:check :lib:ime-dict-tool:test :lib:ime-dict-tool:koverHtmlReport :lib:ime-eval:test :lib:ime-eval:compileUatTestKotlin :build-logic:convention:test

      # the C++ tests of our sherpa-onnx changes (context graph, hotword and blocked-phrase encoding):
      # the runner's g++, with googletest and simple-sentencepiece downloaded SHA-256 checked; no NDK,
      # no CMake
      - name: Run sherpa-onnx host tests
        if: success() || failure()
        run: lib/sherpa-onnx/host-test.sh

      # uat.py's record keeping (attempts, flakes, the JVM cases' run file), no device
      - name: Run UAT tool tests
        if: success() || failure()
        working-directory: uat/tools
        run: python3 -m unittest test_uat

      # the parity driver's log splitting, uat export and dry run (fcitx-replacement §7.2), no device
      - name: Run parity tool tests
        if: success() || failure()
        working-directory: uat/parity
        run: python3 -m unittest test_parity

      # the release gates' scripts (uat/gates): backup retargeting, the INI reading of their checks
      - name: Run gate tool tests
        if: success() || failure()
        working-directory: uat/gates
        run: python3 -m unittest test_gates

      # the lexicon tools' tests: apply.py is the only check that a curator's readings did not slip a line
      - name: Run lexicon tool tests
        if: success() || failure()
        run: python3 -m unittest discover -s lexicon/tools

      # chat.py's readings of the words a chat line means otherwise, which the chat, dialog and mixed sets are typed by
      - name: Run eval tool tests
        if: success() || failure()
        run: python3 -m unittest discover -s lib/ime-eval/tools

      # the theme maker page against what the app makes (web/theme-maker/test/testdata): the drawing
      # rules case by case, the theme file both ways, its export byte for byte (specs/testing.md)
      - name: Setup Node
        if: success() || failure()
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run theme maker tests
        if: success() || failure()
        run: node --test web/theme-maker/test/format.test.mjs

      # Findings already present are frozen in config/detekt/baseline-*.xml; this fails on new ones
      # only. Syntax rules only: type resolution does not work on this toolchain (see detekt.yml).
      - name: Static analysis (detekt)
        if: success() || failure()
        run: ./gradlew --build-cache detekt

      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate_test_failures.py

      - name: Upload test report
        # the report is most useful precisely when the tests failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-core
          # detekt checks every Kotlin module (DetektConventionPlugin), so its reports are globbed
          path: |
            lib/ime-core/build/reports/tests/
            lib/ime-core/build/reports/animalsniffer/
            lib/ime-core/build/reports/kover/
            lib/ime-core/build/test-results/
            lib/ime-dict-tool/build/reports/tests/
            lib/ime-dict-tool/build/reports/kover/
            lib/ime-dict-tool/build/test-results/
            lib/ime-eval/build/reports/tests/
            lib/ime-eval/build/test-results/
            build-logic/convention/build/reports/tests/
            build-logic/convention/build/test-results/
            **/build/reports/detekt/
          retention-days: 14

  app:
    name: App JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      # CMake: the app tests read the engine's data, whose archives are unpacked with it.
      # A Robolectric cache key a job: each fetches its own SDKs' jars (35 here, 29 in app_29)
      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cmake: "true"
          robolectric: robolectric-35

      # debug only (one APK since 0.6.0, voice input in it). The screenshot tests compare against app/src/test/screenshots
      # (roborazzi.test.verify in gradle.properties); goldens are recorded on JDK 21 locally.
      # One ABI: a build of all four links resources once per split, and the unit tests need one.
      - name: Run app unit tests
        env:
          BUILD_ABI: x86_64
        run: ./gradlew --build-cache -PskipExhaustive :app:testDebugUnitTest :app:koverLogDebug

      # what a changed look drew: <name>_actual.png and _compare.png beside the golden
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: roborazzi-differences
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate_test_failures.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-app
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 14

  # Android 10 (minSdk 29) must keep working: every app Robolectric test again at SDK 29, a task of
  # its own (robolectric.properties, app/build.gradle.kts); 0.5.1 shipped two crashes only it shows.
  app_29:
    name: App JVM tests at SDK 29
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cmake: "true"
          robolectric: robolectric-29

      # debug, as above; one ABI
      - name: Run app unit tests at SDK 29
        env:
          BUILD_ABI: x86_64
        run: ./gradlew --build-cache -PskipExhaustive :app:testDebugUnitTestAt29

      - name: Annotate test failures
        if: failure()
        run: python3 .github/scripts/annotate_test_failures.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-29
          path: |
            app/build/reports/tests/testDebugUnitTestAt29/
            app/build/test-results/testDebugUnitTestAt29/
          retention-days: 14
