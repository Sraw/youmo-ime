name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

permissions:
  contents: read

# a newer push makes the builds of the one before it pointless
concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_pull_request:
    runs-on: ubuntu-24.04
    # sherpa-onnx's native build (arm64-v8a, the default ABI), R8 and the text pack
    timeout-minutes: 90
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      # the engine data is unpacked with the SDK's CMake before AGP would install it for the native
      # build; the downloads (engine data, handwriting models, onnxruntime) cached as every workflow's
      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cmake: "true"
          downloads: save
          handwriting: "true"

      # the one APK (voice code and sherpa-onnx's native build included, through R8) and the text
      # pack, signed here with the committed test key: no release key on CI. Not the voice pack: its
      # model comes from youmo.voiceModelDir alone until the streaming model is released
      - name: Build Release APK and the text pack
        run: ./gradlew --build-cache :app:assembleRelease :app:packTextPack

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            app/build/outputs/apk/release/
            app/build/packs/
          retention-days: 7
