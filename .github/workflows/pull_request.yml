name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

permissions:
  contents: read

# a newer push makes the builds of the one before it pointless
concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_pull_request:
    runs-on: ubuntu-24.04
    # sherpa-onnx's native build for all four ABIs, R8 and the text pack
    timeout-minutes: 90
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android environment
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # the engine data is unpacked with the SDK's CMake before AGP would install it for the native
      # build; the version is the build's own (Versions.defaultCMake)
      - name: Install build dependencies
        run: |
          cmake=$(sed -n 's/.*defaultCMake = "\([^"]*\)".*/\1/p' build-logic/convention/src/main/kotlin/Versions.kt)
          sdkmanager --install "cmake;${cmake:?no defaultCMake in Versions.kt}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # libime's sources, the engine-data release's model and words, the strokes, English's model
      # and the sentence models, some 500 MB:
      # keyed on EngineDataPlugin, which names them and their SHA-256. Paths as in every workflow;
      # saved on main by engine_downloads.yml, where a new pull request's first run finds it
      - name: Cache engine data downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads
            !.gradle/engine-downloads/voice
            !.gradle/engine-downloads/handwriting
            !.gradle/engine-downloads/onnxruntime-android-*.zip
          key: engine-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/EngineDataPlugin.kt') }}

      # the handwriting models and onnxruntime, both builds': keyed on the two files that name them
      # and their SHA-256, saved on main by engine_downloads.yml as the engine data is
      - name: Cache handwriting downloads
        uses: actions/cache@v6
        with:
          path: |
            .gradle/engine-downloads/handwriting
            .gradle/engine-downloads/onnxruntime-android-*.zip
          key: handwriting-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/HandwritingDataPlugin.kt', 'lib/handwriting/build.gradle.kts') }}

      # the recognizer's model and the VAD (the voice pack's), keyed on VoiceDataPlugin, which names them
      - name: Cache voice model downloads
        uses: actions/cache@v6
        with:
          path: .gradle/engine-downloads/voice
          key: voice-downloads-${{ hashFiles('build-logic/convention/src/main/kotlin/VoiceDataPlugin.kt') }}

      # the one APK (voice code and sherpa-onnx's native build included, through R8) and the text
      # pack, signed here with the committed test key: no release key on CI. Not the voice pack: its
      # model comes from youmo.voiceModelDir alone until the streaming model is released
      - name: Build Release APK and the text pack
        run: ./gradlew --build-cache :app:assembleRelease :app:packTextPack

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            app/build/outputs/apk/release/
            app/build/packs/
          retention-days: 7
