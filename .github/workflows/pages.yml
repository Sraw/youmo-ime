name: Pages

# The theme maker (web/theme-maker/index.html, one file that needs nothing else) on GitHub Pages:
# web/ without the tests, at https://<owner>.github.io/<repo>/theme-maker/, its index.html the one
# the repository keeps with the engine put in (lib/keyboard-scene's build: tools/assemble.mjs --engine).
# Published only when its own test passes, so a page that reads or writes theme files unlike the app
# never goes up.
# Needs the repository's Pages source set to "GitHub Actions" (Settings › Pages).

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "lib/keyboard-scene/**"
      # what the engine is built with: the Kotlin version, the build's own plugins
      - "gradle/libs.versions.toml"
      - "build-logic/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# one publish at a time; a newer one waits rather than cancels a deployment half done
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and pack the page
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # the page's engine is lib/keyboard-scene's build (060-render-p3 W1), put in the page when it is packed
      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Build the page's engine
        run: ./gradlew --build-cache :lib:keyboard-scene:youmoEngine

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run theme maker tests
        run: node --test web/theme-maker/test/format.test.mjs web/theme-maker/test/engine.test.mjs

      # the site: web/ as it is, the page's tests, sources, tools, fonts (in index.html), dev pages and build
      # left out (index.html is all it needs), its index.html the page with its engine
      - name: Pack the site
        run: |
          mkdir _site
          tar -C web --exclude='./*/test' --exclude='./*/src' --exclude='./*/tools' --exclude='./*/fonts' --exclude='./*/dev' --exclude='./*/build' -cf - . | tar -C _site -xf -
          node web/theme-maker/tools/assemble.mjs --engine _site/theme-maker/index.html
          grep -q "globalThis\['youmo-engine'\] = factory(" _site/theme-maker/index.html
          test ! -e _site/theme-maker/build
          test ! -e _site/theme-maker/test
          test ! -e _site/theme-maker/src
          test ! -e _site/theme-maker/tools
          test ! -e _site/theme-maker/fonts
          test ! -e _site/theme-maker/dev

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}theme-maker/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
