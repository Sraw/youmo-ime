name: Pages

# The theme maker (web/theme-maker/index.html, one file that needs nothing else) on GitHub Pages:
# web/ without the tests, at https://<owner>.github.io/<repo>/theme-maker/. Published only when its
# own test passes, so a page that reads or writes theme files unlike the app never goes up.
# Needs the repository's Pages source set to "GitHub Actions" (Settings › Pages).

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# one publish at a time; a newer one waits rather than cancels a deployment half done
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and pack the page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run theme maker tests
        run: node --test web/theme-maker/test/format.test.mjs

      # the site: web/ as it is, its tests and their files left out
      - name: Pack the site
        run: |
          mkdir _site
          tar -C web --exclude='./*/test' -cf - . | tar -C _site -xf -
          test -f _site/theme-maker/index.html
          test ! -e _site/theme-maker/test

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}theme-maker/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
