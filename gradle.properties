# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# G1 with a periodic GC hands idle heap back to the OS; ParallelGC keeps whatever it grew to
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000
# compile Kotlin inside the Gradle daemon rather than in a second long-lived JVM
# (the daemon's heap above, upstream's 2g, holds the compiler and R8 alike)
kotlin.compiler.execution.strategy=in-process
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# no build cache on a developer's machine, so `clean` clears all: one lexicon edit's engine data and
# compressed assets are some 380 MB of it, kept a week. CI passes --build-cache, as its setup-gradle
# restores the cache with ~/.gradle
org.gradle.caching=false
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
android.nonTransitiveRClass=true
# https://developer.android.com/build/optimize-your-build#disable-the-jetifier-flag
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP2 https://github.com/google/ksp/blob/main/docs/ksp2.md
ksp.useKSP2=true
# Build property overrides
#buildABI=arm64-v8a
#buildVersionName=
#buildCommitHash=
#buildTimestamp=
# an idle daemon exits after ten minutes, not the default three hours; a machine that wants none
# (one that also runs an emulator) sets org.gradle.daemon=false in its ~/.gradle/gradle.properties
org.gradle.daemon.idletimeout=600000
# Roborazzi: every unit test run compares the screenshots with app/src/test/screenshots; record them
# again with -Proborazzi.test.record=true (dev/design/devflow-spike.md)
roborazzi.test.verify=true
