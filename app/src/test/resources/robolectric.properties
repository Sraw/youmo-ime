# Robolectric tests run at SDK 29 (minSdk: Android 10 must keep working) and 35 unless they pin
# another with @Config(sdk = [...]). app/build.gradle.kts gives each its own task, one SDK a JVM
# (robolectric.enabledSdks): :app:testDebugUnitTest the 35s, :app:testDebugUnitTestAt29
# the 29s. Screenshots are compared at 35 alone (SCREENSHOT_SDK). 35 is one below compileSdk: at
# SDK 36, Robolectric 4.17 dies in ApplicationSharedMemory.create on JDK 21 ("Failed to interact
# with raw FileDescriptor internals"), and --add-opens does not help. TestHarnessSmokeTest.RobolectricSmoke
# has a canary for when Robolectric is upgraded.
sdk=29,35
# The app's manifest is on the tests' classpath (UnitTestResourcesPlugin), and Robolectric would
# start the FcitxApplication it names for every test; the tests that want it say so with @Config.
application=android.app.Application
# the default preferences one for every test, as AppPrefs holds the first's: OneDefaultPreferencesShadow
shadows=org.fcitx.fcitx5.android.OneDefaultPreferencesShadow
