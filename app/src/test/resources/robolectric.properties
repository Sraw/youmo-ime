# Robolectric tests run at SDK 35 unless they pin another with @Config(sdk = [...]), as the
# ones at minSdk 29 do. 35 is one below compileSdk: at SDK 36, Robolectric 4.17 dies
# in ApplicationSharedMemory.create on JDK 21 ("Failed to interact with raw FileDescriptor
# internals"), and --add-opens does not help. TestHarnessSmokeTest.RobolectricSmoke has a
# canary for when Robolectric is upgraded.
sdk=35
# The app's manifest is on the tests' classpath (UnitTestResourcesPlugin), and Robolectric would
# start the FcitxApplication it names for every test; the tests that want it say so with @Config.
application=android.app.Application
