# The resource packs (specs/data-and-build.md#resource-packs), versioned apart from the app.
#
# <id>.version: the pack the build makes now. Raise it whenever the pack's content changes: the
#   release listing (releaseBundles) fails a pack whose files changed under the same version.
# <id>.format: the data format the app's code reads and the pack is made in. Raise it only when the
#   code can no longer read the older packs (or the older code the newer ones); the app then refuses
#   a pack of another format and says which it needs. Rare.
# <id>.minVersion: the oldest pack of that format this app takes. Raise it when the app needs data
#   only a newer pack has; users then see "需要更新到 v<minVersion>".
#   Never above <id>.version: the pack this build makes would be refused by this very app.
text.version=1
text.format=1
text.minVersion=1
voice.version=2
voice.format=1
voice.minVersion=2
