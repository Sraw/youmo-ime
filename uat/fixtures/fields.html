<!doctype html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<!-- interactive-widget=resizes-content: the keyboard shrinks the page as it shrinks an app's window,
     so a bar fixed at the bottom sits right above it, as in a chat app; Chrome's default lays the
     keyboard over the page -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="google" content="notranslate">
<title>UAT 输入框</title>
<style>
  body { font: 16px/1.4 sans-serif; margin: 12px; }
  label { display: block; margin: 14px 0 4px; font-weight: bold; }
  input, textarea { width: 100%; box-sizing: border-box; font-size: 18px; padding: 8px; }
  textarea { height: 90px; }
  #log { white-space: pre-wrap; border: 1px solid #ccc; min-height: 3em; padding: 6px; }
  #searched { min-height: 1.4em; margin-top: 6px; }
  button { font-size: 16px; padding: 6px 14px; margin-top: 6px; }
  /* fields.html#chat: the box and its button at the bottom, as a chat app has them */
  body.chat { padding-bottom: 120px; }
  body.chat #chatbar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: flex-end;
    padding: 8px 12px; background: #fff; border-top: 1px solid #ccc; }
  body.chat #chat { flex: 1; width: auto; height: 3em; }
  body.chat #send { margin-top: 0; }
</style>
</head>
<body>
<!-- UAT 用的输入框。打开方法见 uat/README.md「测试页」。
     地址后加 #<id>（如 fields.html#chat）只显示那一个框，放在最上面，好找也好点；聊天框贴在最下面，像聊天应用。 -->
<label for="text">普通文本（text，不自动大写）</label>
<input id="text" type="text" autocapitalize="off">

<label for="sentence">句子（自动大写，textarea，autocapitalize=sentences）</label>
<textarea id="sentence" autocapitalize="sentences"></textarea>

<label for="chat">聊天（回车或点“发送”后清空，像聊天应用）</label>
<div id="chatbar">
<textarea id="chat" enterkeyhint="send"></textarea>
<button id="send" type="button">发送</button>
</div>
<div id="log"></div>

<label for="password">密码（password）</label>
<input id="password" type="password">

<label for="url">网址（url）</label>
<input id="url" type="url">

<label for="email">邮箱（email）</label>
<input id="email" type="email">

<label for="number">数字（number）</label>
<input id="number" type="number">

<label for="tel">电话（tel）</label>
<input id="tel" type="tel">

<label for="search">搜索（search，回车键显示“搜索”，回车后执行搜索）</label>
<form id="searchform" role="search">
<input id="search" type="search" enterkeyhint="search">
<div id="searched"></div>
</form>

<!-- one form: Chrome moves the focus on the input method's "next" only within a form -->
<form id="nextform">
<label for="next">下一项（回车键显示“下一项”）</label>
<input id="next" type="text" enterkeyhint="next">

<label for="nosuggest">不要提示（autocorrect=off spellcheck=false）</label>
<input id="nosuggest" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
</form>

<label for="long">长文本（用来测光标移动、选择，预先填好）</label>
<textarea id="long">今天天气很好，我们一起去公园散步吧。The quick brown fox jumps over the lazy dog.</textarea>

<script>
  // fields.html#<id>: that field alone, at the top (the chat's send button and log, the search's
  // result with it), the chat at the bottom; again as the #<id> changes in a tab showing the page
  function filter() {
    const only = location.hash.slice(1);
    const field = only && document.getElementById(only);
    document.body.classList.toggle('chat', only === 'chat');
    // #next keeps the field after it, where its next action goes
    const after = only === 'next' ? document.getElementById('nosuggest') : null;
    const keeps = el => !field || el.contains(field) || el.htmlFor === only ||
      (only === 'chat' && el.id === 'log') || (after && (el.contains(after) || el.htmlFor === 'nosuggest'));
    for (const el of document.body.children) {
      if (el.tagName === 'SCRIPT') continue;
      el.style.display = keeps(el) ? '' : 'none';
    }
    for (const el of document.getElementById('nextform').children) {
      el.style.display = keeps(el) ? '' : 'none';
    }
  }
  filter();
  window.addEventListener('hashchange', filter);
  // A load is a fresh field to the input method. The app keeps the text last written in a field that
  // cleared itself as the context (ContextMemory: a chat's box after a send), for an app, view, type and
  // hint, which a reload of this page keeps the same: the next step was typed after the last's text (他点了
  // before 他 turned dl's 带来 into 的脸). It forgets that text where the field has text after the cursor:
  // so each field starts with an invisible character after it, gone once the input method has looked.
  for (const el of document.querySelectorAll('input:not([type=password]), textarea')) {
    let primed = false;
    el.addEventListener('focus', () => {
      if (primed || el.value) return;
      primed = true;
      el.value = '\u200b';
      el.setSelectionRange(0, 0);
      setTimeout(() => { if (el.value === '\u200b') el.value = ''; }, 400);
    });
  }
  const chat = document.getElementById('chat');
  const log = document.getElementById('log');
  function send() {
    if (!chat.value) return;
    log.textContent += chat.value + '\n';
    chat.value = '';
  }
  document.getElementById('send').addEventListener('click', () => { send(); chat.focus(); });
  chat.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  // Chrome turns the input method's search action into Enter, which submits a field's form: with no
  // form, nothing happens. Searched as a page does: the field let go, so the keyboard goes
  const search = document.getElementById('search');
  document.getElementById('searchform').addEventListener('submit', e => {
    e.preventDefault();
    document.getElementById('searched').textContent = '搜索：' + search.value;
    search.blur();
  });
</script>
</body>
</html>
