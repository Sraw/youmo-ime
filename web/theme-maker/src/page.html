<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- nothing leaves the browser: no request of any kind, so the line on the page is true; a link someone adds later is refused too.
     Only the page's own two scripts run (by their hashes: tools/assemble.mjs writes them, the page's test checks them) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; font-src blob: data:; style-src 'unsafe-inline'; script-src {{script-hashes}}; connect-src blob: data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>幽默输入法 · 主题制作</title>
<style>
{{css}}
</style>
</head>
<body>
<!-- generated by the app's tests (ThemeMakerFormatTest, ThemeMakerLayoutTest): not edited by hand; -PupdateThemeMaker writes them -->
<script type="application/json" id="youmo-format">
{{youmo-format}}
</script>
<script type="application/json" id="youmo-presets">
{{youmo-presets}}
</script>
<script type="application/json" id="youmo-layout">
{{youmo-layout}}
</script>
<script type="application/json" id="youmo-icons">
{{youmo-icons}}
</script>
<script id="youmo-lib">
{{lib}}
</script>
<script id="youmo-ui">
{{ui}}
</script>
</body>
</html>
