<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- nothing leaves the browser: no request of any kind, so the line on the page is true; a link someone adds later is refused too.
     Only the page's own scripts run (by their hashes: tools/assemble.mjs writes them, the page's test checks them) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; font-src blob: data:; style-src 'unsafe-inline'; script-src {{script-hashes}}; connect-src blob: data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>幽默输入法 · 主题制作</title>
<style>
{{css}}
</style>
<!-- the engine's fonts (tools/subset-fonts.py: Roboto's and Noto Sans SC's characters a keyboard shows) -->
<style id="youmo-fonts">
{{fonts}}
</style>
</head>
<body>
<header id="top">
  <button id="file" aria-haspopup="menu">文件</button>
  <div id="file-menu" class="menu" role="menu" hidden>
    <button data-act="new" role="menuitem">新建…</button>
    <button data-act="open" role="menuitem">打开文件…</button>
    <button data-act="save" role="menuitem">保存 .theme</button>
  </div>
  <button id="undo" title="撤销" aria-label="撤销">↶</button>
  <button id="redo" title="重做" aria-label="重做">↷</button>
  <span id="name" class="name"></span>
  <span class="grow"></span>
  <button id="dark" aria-pressed="false">浅色</button>
  <button id="env">环境</button>
  <a class="link" href="classic/">旧版</a>
</header>
<main id="main">
  <section id="preview-area">
    <canvas id="preview" aria-label="键盘预览"></canvas>
    <div id="picked" class="muted"></div>
  </section>
  <section id="edit">
    <nav id="tabs" role="tablist">
      <button role="tab" data-tab="source" aria-selected="true">源码</button>
    </nav>
    <div id="tab-source" class="tab">
      <p class="muted">theme.xml 全文：改完即时重读，问题在下面列出，点一条跳到那一行。</p>
      <textarea id="source" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
  </section>
  <section id="problems-area">
    <h2>问题 <span id="count"></span></h2>
    <ul id="problems"></ul>
  </section>
</main>
<dialog id="env-panel">
  <form method="dialog" id="env-form">
    <h2>预览环境</h2>
    <label>设备 <select id="env-device"></select></label>
    <label>宽 px <input id="env-w" type="number" min="200" max="4000"></label>
    <label>高 px <input id="env-h" type="number" min="200" max="4000"></label>
    <label>密度 <input id="env-density" type="number" min="0.75" max="5" step="0.025"></label>
    <label><input id="env-landscape" type="checkbox"> 横屏</label>
    <label>键盘 <select id="env-board"></select></label>
    <label>形态 <select id="env-form-kind"></select></label>
    <label>Shift <select id="env-shift"><option value="none">关</option><option value="once">一次</option><option value="lock">锁定</option></select></label>
    <button value="close">完成</button>
  </form>
</dialog>
<dialog id="new-panel">
  <form method="dialog">
    <h2>新建主题</h2>
    <p>从内置主题开始：</p>
    <div id="builtins" class="cards"></div>
    <p>从一张图片开始（图片做键盘背景，之后在「背景」里裁切、在「配色」里取色）。先用这套配色：</p>
    <div id="image-base" class="cards" role="radiogroup" aria-label="图片主题的配色"></div>
    <button type="button" id="from-image">选图片…</button>
    <p>或者 <button type="button" id="from-file">打开文件…</button>（.theme：4.0、3.0、2.1）</p>
    <button value="cancel">取消</button>
  </form>
</dialog>
<dialog id="restore-panel">
  <form method="dialog">
    <p id="restore-text"></p>
    <button value="restore">恢复</button> <button value="discard">丢弃草稿</button>
  </form>
</dialog>
<input id="open-input" type="file" accept=".theme,.zip,.xml,application/zip" hidden>
<input id="any-input" type="file" hidden>
<input id="image-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<!-- generated by the app's tests (ThemeMakerFormatTest, ThemeMakerLayoutTest, EnginePaintTest): not edited by hand; -PupdateThemeMaker writes them -->
<script type="application/json" id="youmo-format">
{{youmo-format}}
</script>
<script type="application/json" id="youmo-engine-icons">
{{youmo-engine-icons}}
</script>
<!-- the drawing engine (060-render-p3 W1): lib/keyboard-scene's library, ./gradlew :lib:keyboard-scene:youmoEngine -->
<script id="youmo-engine">
{{engine}}
</script>
<script id="youmo-lib">
{{lib}}
</script>
<script id="youmo-maker">
{{maker}}
</script>
<script id="youmo-form">
{{form}}
</script>
<script id="youmo-panels">
{{panels}}
</script>
<script id="youmo-ui">
{{ui}}
</script>
</body>
</html>
