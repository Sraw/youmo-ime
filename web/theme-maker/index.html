<title>幽默输入法 · 主题制作</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2024; --muted: #5f6670; --line: #dde1e6;
  --accent: #3b6fd8; --accent-ink: #ffffff; --warn: #9a6400; --err: #b3261e;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1f2226; --ink: #e6e8eb; --muted: #a0a7b0; --line: #343941;
    --accent: #8fb2ff; --accent-ink: #0b1a33; --warn: #ffcf6b; --err: #ffb4ab;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
button:disabled { opacity: .4; cursor: default; }
button[aria-pressed="true"], button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.muted { color: var(--muted); font-size: 12px; }
.grow { flex: 1; }
.link { color: var(--accent); font-size: 12px; }
#top { display: flex; gap: 4px; align-items: center; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); position: relative; }
#top .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
.menu { position: absolute; top: 100%; left: 8px; z-index: 5; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
.menu[hidden] { display: none; }
.menu button { border: 0; text-align: left; }
/* the phone first (060-render-p3 §5.1): the preview the top 40 %, fixed; the editing under it, scrolling */
#main { flex: 1; min-height: 0; display: grid; grid-template-rows: 40vh 1fr auto; }
#preview-area { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; border-bottom: 1px solid var(--line); min-height: 0; }
#preview { max-width: 100%; max-height: calc(40vh - 32px); touch-action: none; }
#edit { overflow: auto; padding: 8px; min-height: 0; }
#tabs { display: flex; gap: 4px; margin-bottom: 6px; overflow-x: auto; }
#source { width: 100%; min-height: 40vh; font: 12px/1.45 ui-monospace, Menlo, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px; white-space: pre; }
#problems-area { max-height: 22vh; overflow: auto; padding: 4px 8px; border-top: 1px solid var(--line); background: var(--panel); }
#problems-area h2 { font-size: 13px; margin: 4px 0; }
#problems { list-style: none; margin: 0; padding: 0; }
#problems li { padding: 2px 0; cursor: pointer; font-size: 12px; }
#problems li.error { color: var(--err); }
#problems li.warning { color: var(--warn); }
/* the desktop: the preview left, the editing right, the problems under both */
@media (min-width: 900px) {
  #main { grid-template-columns: minmax(0, 1fr) minmax(360px, 1fr); grid-template-rows: 1fr auto; }
  #preview-area { grid-row: 1; grid-column: 1; border-bottom: 0; border-right: 1px solid var(--line); }
  #preview { max-height: calc(100vh - 160px); }
  #edit { grid-row: 1; grid-column: 2; }
  #problems-area { grid-row: 2; grid-column: 1 / 3; }
}
dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; max-width: min(520px, 94vw); }
dialog form { display: flex; flex-direction: column; gap: 8px; }
dialog h2 { margin: 0; font-size: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
#toast { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 92vw; }
#toast.on { opacity: 1; }
</style>

<script id="youmo-engine">
/* the engine (060-render-p3 W1) is put in where the page is built: ./gradlew :lib:keyboard-scene:youmoEngine, then node web/theme-maker/tools/assemble.mjs --engine */
</script>
<script id="youmo-lib">
// youmo-lib: the theme maker's code that touches no page — zip, the theme file, the app's drawing
// rules. Run as it is by the page and by test/format.test.mjs (node:vm), so it uses only what both
// have: TextEncoder/TextDecoder, DecompressionStream, Math.
(function (root) {
  'use strict';

  // ---- errors the page tells apart ----
  class ThemeError extends Error {
    // code: not-theme | newer | older | bad | missing | limit (detail: which) | image (one the app cannot read the size of)
    constructor(code, detail) {
      super(code + (detail ? ': ' + detail : ''));
      this.code = code;
      this.detail = detail || '';
    }
  }

  // ---- CRC-32 ----
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  // ---- zip: written STORED at a fixed time, so the same input is the same bytes ----
  // 2026-01-01 00:00 as DOS time and date, as the app's test fixtures are stamped
  const DOS_TIME = 0;
  const DOS_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1;

  /** entries: [[name, Uint8Array]] → the zip's bytes; names UTF-8 (flag bit 11), CRC and sizes in the local header. */
  function writeZip(entries) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;
    for (const [name, data] of entries) {
      const nameBytes = enc.encode(name);
      const crc = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 10, true); // version needed: 1.0
      local.setUint16(6, 0x0800, true); // UTF-8 names
      local.setUint16(8, 0, true); // STORED
      local.setUint16(10, DOS_TIME, true);
      local.setUint16(12, DOS_DATE, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);
      parts.push(new Uint8Array(local.buffer), nameBytes, data);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true); // made by: MS-DOS, 2.0
      cd.setUint16(6, 10, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint16(10, 0, true);
      cd.setUint16(12, DOS_TIME, true);
      cd.setUint16(14, DOS_DATE, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, data.length, true);
      cd.setUint32(24, data.length, true);
      cd.setUint16(28, nameBytes.length, true);
      // extra, comment, disk, internal attributes 0
      cd.setUint32(38, 0, true); // external attributes
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), nameBytes);
      offset += 30 + nameBytes.length + data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
    let at = 0;
    for (const p of all) {
      out.set(p, at);
      at += p.length;
    }
    return out;
  }

  /** [bytes] inflated, counted as they come: past [max] bytes it stops (a zip bomb is never whole in memory) and throws. */
  async function inflateRaw(bytes, max, what) {
    const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const parts = [];
    let n = 0;
    for (;;) {
      let r;
      try {
        r = await reader.read();
      } catch (e) {
        throw new ThemeError('not-theme', 'bad data in ' + what);
      }
      if (r.done) break;
      n += r.value.length;
      if (n > max) {
        await reader.cancel().catch(() => {});
        throw new ThemeError('not-theme', what + ' is more than its zip says');
      }
      parts.push(r.value);
    }
    const out = new Uint8Array(n);
    let at = 0;
    for (const p of parts) {
      out.set(p, at);
      at += p.length;
    }
    return out;
  }

  /**
   * A zip's entries by its central directory (so an entry with a data descriptor, as the app writes
   * them, reads too): [{name, size, read: async () => Uint8Array}], size what the zip says it unpacks to.
   * STORED and DEFLATE; read never takes more than that size, nor from outside the zip.
   */
  function readZip(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const bad = (why) => {
      throw new ThemeError('not-theme', why);
    };
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 22 - 65535); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) {
        eocd = i;
        break;
      }
    }
    if (eocd < 0) bad('not a zip');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder();
    const out = [];
    for (let n = 0; n < count; n++) {
      if (p + 46 > bytes.length || dv.getUint32(p, true) !== 0x02014b50) bad('bad central directory');
      const flags = dv.getUint16(p + 8, true);
      const method = dv.getUint16(p + 10, true);
      const crc = dv.getUint32(p + 16, true);
      const packed = dv.getUint32(p + 20, true);
      const size = dv.getUint32(p + 24, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      if (p + 46 + nameLen > bytes.length) bad('bad central directory');
      const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      if (flags & 1) bad('encrypted');
      out.push({
        name,
        size,
        async read() {
          if (local + 30 > bytes.length || dv.getUint32(local, true) !== 0x04034b50) bad('bad local header of ' + name);
          const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
          if (start + packed > bytes.length) bad(name + ' runs past the zip');
          const raw = bytes.subarray(start, start + packed);
          let data;
          if (method === 0) data = raw.slice();
          else if (method === 8) data = await inflateRaw(raw, size, name);
          else bad('compression ' + method);
          if (data.length !== size) bad(name + ' is not the size its zip says');
          if (crc32(data) !== crc) bad('CRC of ' + name);
          return data;
        },
      });
    }
    return out;
  }

  // ---- the theme file ----
  // format: the youmo-format block (the app's ThemeMakerFormatTest holds it to ThemeFileJson's fields)

  function typeOf(v) {
    if (v === null) return 'null';
    if (Array.isArray(v)) return 'array';
    return typeof v;
  }

  /** [v] checked against the type [t] of [format] (strictly, as the app's Json reads): what is wrong, by path. */
  function check(format, t, v, path) {
    if (t.endsWith('?')) {
      if (v === null) return;
      t = t.slice(0, -1);
    }
    const bad = (why) => {
      throw new ThemeError('bad', path + ': ' + why);
    };
    if (v === null || v === undefined) bad('missing');
    if (t === 'int') {
      if (!Number.isInteger(v) || v < -2147483648 || v > 2147483647) bad('not an int');
      return;
    }
    if (t === 'string') {
      if (typeof v !== 'string') bad('not a string');
      return;
    }
    if (t === 'boolean') {
      if (typeof v !== 'boolean') bad('not a boolean');
      return;
    }
    if (t.startsWith('[')) {
      if (!Array.isArray(v)) bad('not a list');
      v.forEach((x, i) => check(format, t.slice(1, -1), x, path + '[' + i + ']'));
      return;
    }
    if (t.startsWith('{')) {
      if (typeOf(v) !== 'object') bad('not an object');
      for (const k of Object.keys(v)) check(format, t.slice(1, -1), v[k], path + '[' + JSON.stringify(k) + ']');
      return;
    }
    const def = format.types[t];
    if (!def) throw new Error('no type ' + t);
    if (def['@enum']) {
      if (!def['@enum'].includes(v)) bad('not one of ' + def['@enum'].join(', '));
      return;
    }
    if (typeOf(v) !== 'object') bad('not an object');
    let fields = def;
    if (def['@sealed']) {
      if (!Object.prototype.hasOwnProperty.call(def['@sealed'], v.type)) bad('type ' + JSON.stringify(v.type) + ' not known');
      fields = def['@sealed'][v.type];
    }
    for (const k of Object.keys(v)) {
      if (def['@sealed'] && k === 'type') continue;
      if (!Object.prototype.hasOwnProperty.call(fields, k)) bad('field ' + JSON.stringify(k) + ' not known');
    }
    for (const k of Object.keys(fields)) {
      if (!Object.prototype.hasOwnProperty.call(v, k)) bad('field ' + JSON.stringify(k) + ' missing');
      check(format, fields[k], v[k], path + '.' + k);
    }
  }

  /** [v] with its keys in the format's order: the order the app writes (version first). */
  function ordered(format, t, v) {
    if (t.endsWith('?')) {
      if (v === null) return null;
      t = t.slice(0, -1);
    }
    if (t === 'int' || t === 'string' || t === 'boolean') return v;
    if (t.startsWith('[')) return v.map((x) => ordered(format, t.slice(1, -1), x));
    if (t.startsWith('{')) {
      const o = {};
      for (const k of Object.keys(v)) o[k] = ordered(format, t.slice(1, -1), v[k]);
      return o;
    }
    const def = format.types[t];
    if (def['@enum']) return v;
    const o = {};
    let fields = def;
    if (def['@sealed']) {
      o.type = v.type;
      fields = def['@sealed'][v.type];
    }
    for (const k of Object.keys(fields)) o[k] = ordered(format, fields[k], v[k]);
    return o;
  }

  const BOARD_SYNTAX = /^[a-z0-9]+(-[a-z0-9]+)*$/;

  /** A key name read as KeyNames.parse does: {board, key}; one not board/key throws. */
  function parseKeyName(text) {
    const slash = text.indexOf('/');
    if (slash <= 0) throw new ThemeError('bad', 'key name "' + text + '" is not board/key');
    const board = text.substring(0, slash);
    const key = text.substring(slash + 1);
    if (!(board === '*' || BOARD_SYNTAX.test(board))) throw new ThemeError('bad', 'key name "' + text + '" has a bad board');
    if (key.length === 0 || /\s/.test(key)) throw new ThemeError('bad', 'key name "' + text + '" has a bad key');
    return { board, key };
  }

  /** Whether [names] (KeyNames: {roles, positions}) know the name, as KeyNames.isKnown. */
  function isKnownKeyName(names, text) {
    const { board, key } = parseKeyName(text);
    if (board === '*') return names.roles.includes(key);
    const pos = names.positions[board];
    return !!pos && (pos.includes(key) || names.roles.includes(key));
  }

  // the four kinds a key is drawn as, in the theme file's order; every walk over the kinds' styles goes through these
  const KINDS = ['letter', 'function', 'space', 'enter'];
  const kindStyles = (keys) => KINDS.map((k) => keys[k]);

  function inRange(v, lo, hi, what) {
    if (v < lo || v > hi) throw new ThemeError('bad', what + ' ' + v + ' out of ' + lo + '..' + hi);
  }

  /** What ThemeLook refuses as it is made: ranges, quarter turns, a picture shown but none, key names. */
  function checkRanges(format, theme) {
    const L = format.limits;
    const pic = theme.picture;
    const shows = (f) => f && f.type === 'picture';
    const k = theme.keys;
    const kinds = kindStyles(k);
    const showsPicture = theme.base.type === 'picture' || theme.bar.type === 'picture' ||
      kinds.some((s) => shows(s.fill)) || Object.values(k.overrides).some((o) => shows(o.fill));
    if (!pic && showsPicture) throw new ThemeError('bad', 'the picture is shown but there is none');
    const blur = (v, w) => inRange(v, 0, L.blurDp, w + '.blurDp');
    const bright = (v, w) => inRange(v, 0, 100, w + '.brightness');
    const crop = (c, w) => {
      if (c.rotation % 90 !== 0 || c.rotation < 0 || c.rotation > 270) throw new ThemeError('bad', w + ' rotation ' + c.rotation + ' is not a quarter turn');
    };
    if (pic) {
      bright(pic.brightness, 'picture');
      blur(pic.blurDp, 'picture');
      crop(pic.portrait, 'portrait');
      if (pic.landscape) crop(pic.landscape, 'landscape');
    }
    if (theme.bar.type === 'picture') {
      blur(theme.bar.blurDp, 'bar');
      bright(theme.bar.brightness, 'bar');
    }
    const slice = (s, w) => {
      if (s.insets.length !== 4) throw new ThemeError('bad', w + ': insets are left, top, right, bottom');
      if (s.insets.some((x) => x < 0)) throw new ThemeError('bad', w + ': negative insets');
      inRange(s.pxPerDp, 1, L.pxPerDp, w + '.pxPerDp');
    };
    const fill = (f, w) => {
      if (!f) return;
      if (f.type === 'image') slice(f, w);
      if (f.type === 'picture') {
        blur(f.blurDp, w);
        bright(f.brightness, w);
      }
    };
    const pressed = (p, w) => {
      if (p && p.type === 'image') slice(p, w);
    };
    inRange(k.radiusDp, 0, L.radiusDp, 'radiusDp');
    inRange(k.borderDp, 0, L.borderDp, 'borderDp');
    inRange(k.shadowDp, 0, L.shadowDp, 'shadowDp');
    for (const g of ['h', 'v', 'hLand', 'vLand']) inRange(k.gap[g], 0, L.gapDp, 'gap.' + g);
    for (const kind of KINDS) {
      fill(k[kind].fill, kind);
      pressed(k[kind].pressed, kind);
    }
    for (const [name, o] of Object.entries(k.overrides)) {
      parseKeyName(name);
      fill(o.fill, name);
      pressed(o.pressed, name);
    }
    if (!L.weights.includes(theme.text.keyWeight) || !L.weights.includes(theme.text.candidateWeight)) {
      throw new ThemeError('bad', 'a weight not in ' + L.weights.join(', '));
    }
    inRange(theme.text.keyScale, L.keyScale[0], L.keyScale[1], 'keyScale');
  }

  /** The files a theme names, each once, in the order the app exports them (ThemeLook.files). */
  function lookFiles(theme) {
    const out = [];
    const add = (f) => {
      if (f && !out.includes(f)) out.push(f);
    };
    const img = (x) => (x && x.type === 'image' ? x.file : null);
    const p = theme.picture;
    if (p) {
      add(p.src);
      add(p.portrait.file);
      if (p.landscape) add(p.landscape.file);
    }
    const k = theme.keys;
    for (const s of kindStyles(k)) {
      add(img(s.fill));
      add(img(s.pressed));
    }
    for (const o of Object.values(k.overrides)) {
      add(img(o.fill));
      add(img(o.pressed));
    }
    add(theme.text.keyFont);
    add(theme.text.candidateFont);
    return out;
  }

  /** The theme file's text as the app writes it: compact, version first, fields in the app's order. */
  function writeTheme(format, theme) {
    const body = ordered(format, 'ThemeFile', theme);
    return JSON.stringify(Object.assign({ version: format.version }, body));
  }

  const PALETTE_21 = [
    'backgroundColor', 'barColor', 'keyboardColor', 'keyBackgroundColor', 'keyTextColor', 'candidateTextColor',
    'candidateLabelColor', 'candidateCommentColor', 'altKeyBackgroundColor', 'altKeyTextColor',
    'accentKeyBackgroundColor', 'accentKeyTextColor', 'keyPressHighlightColor', 'keyShadowColor',
    'popupBackgroundColor', 'popupTextColor', 'spaceBarColor', 'dividerColor', 'clipboardEntryColor',
    'genericActiveBackgroundColor', 'genericActiveForegroundColor',
  ];

  /** The look of a theme that sets none but its colours (LookDefaults), keys and text by the format's defaults. */
  function defaultLook(format, name, isDark, palette, picture) {
    return {
      name,
      isDark,
      palette,
      picture: picture || null,
      base: { type: picture ? 'picture' : 'color' },
      bar: { type: 'transparent' },
      keys: JSON.parse(JSON.stringify(format.defaults.keys)),
      text: JSON.parse(JSON.stringify(format.defaults.text)),
    };
  }

  /** A 2.1 theme file (an app before 3.0 wrote it) as 3.0: CustomThemeSerializer's from21, the same json. */
  function from21(format, obj) {
    const need = (k) => {
      if (!(k in obj)) throw new ThemeError('bad', 'field ' + k + ' missing');
      return obj[k];
    };
    // as the app's jsonPrimitive.int: a number past an Int is refused, not cut to one
    const int = (v, w) => {
      if (!Number.isInteger(v) || v < -2147483648 || v > 2147483647) throw new ThemeError('bad', w + ' not an int');
      return v;
    };
    const palette = {};
    for (const k of PALETTE_21) palette[k] = int(need(k), k);
    palette.keyBorderColor = palette.keyShadowColor;
    palette.keyHintColor = palette.altKeyTextColor;
    palette.toolbarIconColor = palette.altKeyTextColor;
    let picture = null;
    const image = obj.backgroundImage;
    if (image && typeOf(image) === 'object') {
      let rect = null;
      if (image.cropRect && typeOf(image.cropRect) === 'object') {
        // an edge left out was -1 (the old Rect reader's), not a refused theme
        const side = (k) => (k in image.cropRect ? int(image.cropRect[k], 'cropRect.' + k) : -1);
        rect = { bottom: side('bottom'), left: side('left'), right: side('right'), top: side('top') };
      }
      if (!('srcFilePath' in image) || !('croppedFilePath' in image)) throw new ThemeError('bad', 'backgroundImage without its files');
      picture = {
        src: String(image.srcFilePath),
        portrait: {
          file: String(image.croppedFilePath),
          cropRect: rect,
          rotation: 'cropRotation' in image ? int(image.cropRotation, 'cropRotation') : 0,
        },
        landscape: null,
        brightness: 'brightness' in image ? int(image.brightness, 'brightness') : 70,
        blurDp: 0,
      };
    }
    if (typeof need('name') !== 'string') throw new ThemeError('bad', 'name not a string');
    if (typeof need('isDark') !== 'boolean') throw new ThemeError('bad', 'isDark not a boolean');
    const theme = defaultLook(format, obj.name, obj.isDark, palette, picture);
    checkRanges(format, theme);
    return theme;
  }

  /**
   * A theme file's text read: {theme, migrated}. 3.0 as the app reads it (every field, none more);
   * 2.1 brought to 3.0 as the app does; older ones and newer ones refused, each with its code.
   */
  function readTheme(format, text) {
    let obj;
    try {
      obj = JSON.parse(text);
    } catch (e) {
      throw new ThemeError('not-theme', 'not json');
    }
    if (typeOf(obj) !== 'object') throw new ThemeError('not-theme', 'not an object');
    const version = 'version' in obj ? String(obj.version) : '1.0';
    if (version === format.version) {
      const body = Object.assign({}, obj);
      delete body.version;
      check(format, 'ThemeFile', body, '$');
      checkRanges(format, body);
      return { theme: ordered(format, 'ThemeFile', body), migrated: false };
    }
    if (format.migrates.includes(version)) return { theme: from21(format, obj), migrated: true };
    if (format.older.includes(version)) throw new ThemeError('older', version);
    throw new ThemeError('newer', version);
  }

  /** A file name the app takes as one file in its themes' directory (ThemeFilesManager.importedFile): never a path, a json, or SAVING. */
  function isThemeFileName(name) {
    return isPlainFileName(name) && !name.toLowerCase().endsWith('.json') && name !== '.saving' && utf8Length(name) <= 255;
  }
  /** As the app's isPlainFileName: not empty, not . or .., no slash. */
  function isPlainFileName(name) {
    return name.length > 0 && name !== '.' && name !== '..' && !name.includes('/');
  }
  const utf8Length = (s) => new TextEncoder().encode(s).length;
  /** File(name).name: the last part of a path. */
  const baseName = (name) => name.substring(name.lastIndexOf('/') + 1);
  /**
   * An entry's name as the app's unpacking resolves it (File(dir, name).canonicalPath): the parts
   * left once . and .. are taken; one out of the zip's top refuses the zip, as the app does.
   */
  function entryPath(name) {
    const parts = [];
    for (const x of name.split('/')) {
      if (x === '' || x === '.') continue;
      if (x === '..') {
        if (!parts.length) throw new ThemeError('not-theme', 'entry ' + JSON.stringify(name) + ' outside the zip');
        parts.pop();
      } else parts.push(x);
    }
    return parts;
  }

  /** [theme] with each file name it has as [fn] makes it (ThemeLook.mapFiles). */
  function mapFiles(theme, fn) {
    const t = JSON.parse(JSON.stringify(theme));
    const p = t.picture;
    if (p) {
      p.src = fn(p.src);
      p.portrait.file = fn(p.portrait.file);
      if (p.landscape) p.landscape.file = fn(p.landscape.file);
    }
    const img = (x) => {
      if (x && x.type === 'image') x.file = fn(x.file);
    };
    const k = t.keys;
    for (const s of [...kindStyles(k), ...Object.values(k.overrides)]) {
      img(s.fill);
      img(s.pressed);
    }
    if (t.text.keyFont) t.text.keyFont = fn(t.text.keyFont);
    if (t.text.candidateFont) t.text.candidateFont = fn(t.text.candidateFont);
    return t;
  }

  /**
   * An image file's width and height from its header, before it is decoded (as the app's probe reads
   * them): PNG, JPEG, WebP; null for another, or one too short to say.
   */
  function imageSize(bytes) {
    const n = bytes.length;
    const u16be = (i) => (bytes[i] << 8) | bytes[i + 1];
    const u32be = (i) => ((bytes[i] << 24) | (bytes[i + 1] << 16) | (bytes[i + 2] << 8) | bytes[i + 3]) >>> 0;
    const u16le = (i) => bytes[i] | (bytes[i + 1] << 8);
    const u24le = (i) => bytes[i] | (bytes[i + 1] << 8) | (bytes[i + 2] << 16);
    const type = imageType(bytes);
    if (type === 'png') return n >= 24 ? [u32be(16), u32be(20)] : null;
    if (type === 'jpg') {
      let i = 2;
      while (i + 9 < n) {
        if (bytes[i] !== 0xff) return null;
        const m = bytes[i + 1];
        if (m === 0xff) { i++; continue; }
        if (m === 0xd8 || m === 0x01 || (m >= 0xd0 && m <= 0xd7)) { i += 2; continue; }
        // a frame's start (SOF0..SOF15 but DHT, JPG, DAC): its height, then its width
        if (m >= 0xc0 && m <= 0xcf && m !== 0xc4 && m !== 0xc8 && m !== 0xcc) return [u16be(i + 7), u16be(i + 5)];
        i += 2 + u16be(i + 2);
      }
      return null;
    }
    if (type === 'webp') {
      const tag = String.fromCharCode(bytes[12], bytes[13], bytes[14], bytes[15]);
      if (tag === 'VP8 ' && n >= 30) return [u16le(26) & 0x3fff, u16le(28) & 0x3fff];
      if (tag === 'VP8L' && n >= 25) {
        const b = bytes;
        return [1 + (b[21] | ((b[22] & 0x3f) << 8)), 1 + ((b[22] >> 6) | (b[23] << 2) | ((b[24] & 0x0f) << 10))];
      }
      if (tag === 'VP8X' && n >= 30) return [1 + u24le(24), 1 + u24le(27)];
      return null;
    }
    if (type === 'gif') return n >= 10 ? [u16le(6), u16le(8)] : null;
    return null;
  }

  /**
   * A theme zip opened as the app imports one (ThemeFilesManager.importTheme): refused past
   * ThemeAssetLimits by what the zip says before anything is unpacked (every entry counted, a folder's
   * too), each entry unpacked no bigger than it says; the json at its top (one; a Mac's `._` passed
   * over), every file it names found at the top by its last part (File(name).name; of two entries of a
   * name the later, as unpacking writes it over the first), the pictures' and key images' sizes read
   * from their headers before anything decodes them (PNG, JPEG, WebP, GIF: another is refused, where
   * the app may read it). {theme, migrated, files: {name: Uint8Array}}, the
   * theme's file names their last parts, as the app keeps them.
   */
  async function openZip(format, bytes) {
    const lim = format.limits;
    const all = readZip(bytes);
    let total = 0;
    all.forEach((e, i) => {
      const breach = entryBreach(lim, i + 1, e.size, total);
      if (breach) throw new ThemeError('limit', breach);
      total += e.size;
    });
    const top = new Map();
    for (const e of all) {
      const parts = entryPath(e.name);
      if (parts.length === 1 && !e.name.endsWith('/')) top.set(parts[0], e);
    }
    const jsons = [...top.keys()].filter((n) => n.endsWith('.json') && !n.startsWith('._'));
    // stricter than the app (it takes the first json): a zip of two is not one the app exported
    if (jsons.length !== 1) throw new ThemeError('not-theme', jsons.length + ' json files');
    const read = readTheme(format, new TextDecoder().decode(await top.get(jsons[0]).read()));
    if (Object.keys(read.theme.keys.overrides).length > lim.overrides) throw new ThemeError('limit', 'overrides');
    if (!isPlainFileName(read.theme.name)) throw new ThemeError('bad', 'name ' + JSON.stringify(read.theme.name));
    for (const name of lookFiles(read.theme)) {
      if (!isThemeFileName(baseName(name))) throw new ThemeError('missing', name);
    }
    const theme = mapFiles(read.theme, baseName);
    const files = Object.create(null);
    for (const name of lookFiles(theme)) {
      const e = top.get(name);
      if (!e) throw new ThemeError('missing', name);
      files[name] = await e.read();
    }
    const side = (name, max, what) => {
      const s = imageSize(files[name]);
      if (!s) throw new ThemeError('image', name);
      if (Math.max(s[0], s[1]) > max) throw new ThemeError('limit', what);
    };
    const p = theme.picture;
    if (p) for (const c of [p.portrait, p.landscape]) if (c) side(c.file, lim.pictureSide, 'pictureSide');
    for (const n of keyImageFiles(theme)) {
      side(n, lim.keyImageSide, 'keyImageSide');
      if (files[n].length > lim.keyImageBytes) throw new ThemeError('limit', 'keyImageBytes');
    }
    return { theme, migrated: read.migrated, files };
  }

  /** ThemeAssetLimits.entry: the [count]th entry, [size] bytes, after [total] bytes before it; null when it passes. */
  function entryBreach(lim, count, size, total) {
    if (count > lim.entries) return 'entries';
    if (size > lim.fileBytes) return 'fileBytes';
    if (total + size > lim.totalBytes) return 'totalBytes';
    return null;
  }

  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  /** The json entry's name in the zip: the theme's name, as the app writes it. */
  const jsonName = (theme) => theme.name + '.json';

  /**
   * The zip of [theme] and its [files] ({name: Uint8Array}), as the app exports one: each file once,
   * the json last; a name the app would not take as a file of its own refused.
   */
  function exportZip(format, theme, files) {
    if (!isPlainFileName(theme.name) || utf8Length(jsonName(theme)) > 255) throw new ThemeError('bad', 'name ' + JSON.stringify(theme.name));
    const names = lookFiles(theme);
    const entries = names.map((n) => {
      if (!isThemeFileName(n)) throw new ThemeError('bad', 'file name ' + JSON.stringify(n));
      if (!has(files, n)) throw new ThemeError('missing', n);
      return [n, files[n]];
    });
    entries.push([jsonName(theme), new TextEncoder().encode(writeTheme(format, theme))]);
    return writeZip(entries);
  }

  /**
   * What the app refuses as it imports (ThemeAssetLimits), checked before a zip is offered: [{what, detail}].
   * Every entry is counted as the app counts it, the json too.
   */
  function limitBreaches(format, theme, files, sizes) {
    const L = format.limits;
    const out = [];
    const names = lookFiles(theme);
    const json = utf8Length(writeTheme(format, theme));
    if (names.length + 1 > L.entries) out.push({ what: 'entries', detail: names.length + 1 });
    let total = json;
    for (const n of names) {
      const len = has(files, n) ? files[n].length : 0;
      total += len;
      if (len > L.fileBytes) out.push({ what: 'fileBytes', detail: n });
    }
    if (total > L.totalBytes) out.push({ what: 'totalBytes', detail: total });
    const overrides = Object.keys(theme.keys.overrides).length;
    if (overrides > L.overrides) out.push({ what: 'overrides', detail: overrides });
    const pic = theme.picture;
    if (pic) {
      for (const c of [pic.portrait, pic.landscape]) {
        const s = c && has(sizes, c.file) ? sizes[c.file] : null;
        if (s && Math.max(s[0], s[1]) > L.pictureSide) out.push({ what: 'pictureSide', detail: c.file });
      }
    }
    for (const n of keyImageFiles(theme)) {
      const s = has(sizes, n) ? sizes[n] : null;
      if (s && Math.max(s[0], s[1]) > L.keyImageSide) out.push({ what: 'keyImageSide', detail: n });
      if (has(files, n) && files[n].length > L.keyImageBytes) out.push({ what: 'keyImageBytes', detail: n });
    }
    return out;
  }

  function keyImageFiles(theme) {
    const out = new Set();
    const img = (x) => x && x.type === 'image' && out.add(x.file);
    const k = theme.keys;
    for (const s of [...kindStyles(k), ...Object.values(k.overrides)]) {
      img(s.fill);
      img(s.pressed);
    }
    return [...out];
  }

  // ---- the app's drawing rules, as ime-core computes them (Float arithmetic: Math.fround each step) ----
  const f = Math.fround;

  function area(l, t, r, b) {
    return [f(l), f(t), f(r), f(b)];
  }

  /**
   * KeyFaceGeometry.of: {face, shadow, border, pressed, radius, oval}; areas [l, t, r, b]. With [own]
   * (a key's Border, the layout's b: default | on | off | special) the four-argument of(): on a face
   * though the keys are flat, off none, special its kind's when flat, default a letter's when flat.
   */
  function keyFace(width, height, kind, keys, landscape, density, margin = true, own) {
    if (own === 'on') return keyFace(width, height, kind, { ...keys, blocks: true }, landscape, density, margin);
    if (own === 'off') return { ...keyFace(width, height, kind, keys, landscape, density, margin), face: null, shadow: null, border: 0, oval: false };
    if (own === 'default' && !keys.blocks) return keyFace(width, height, 'letter', keys, landscape, density, margin);
    width = f(width);
    height = f(height);
    density = f(density);
    const h = !margin ? 0 : f((landscape ? keys.gap.hLand : keys.gap.h) * density);
    const v = !margin ? 0 : f((landscape ? keys.gap.vLand : keys.gap.v) * density);
    const inner = area(h, v, f(width - h), f(height - v));
    if (keys.blocks) {
      const radius = f(keys.radiusDp * density);
      const shadow = keys.shadowDp > 0 ? [inner[0], inner[1], inner[2], Math.min(f(inner[3] + f(keys.shadowDp * density)), height)] : null; // kept within the cell, as the app's
      return { face: inner, shadow, border: f(keys.borderDp * density), pressed: inner, radius, oval: false };
    }
    if (kind === 'space') {
      const minHeight = f(26 * density);
      const hInset = f(10 * density);
      const vInset = height < minHeight ? 0 : Math.min(f(f(height - minHeight) / 2), f(16 * density));
      const bar = area(hInset, vInset, f(width - hInset), f(height - vInset));
      return { face: bar, shadow: null, border: 0, pressed: bar, radius: f(3 * density), oval: false };
    }
    if (kind === 'enter') {
      const size = Math.min(Math.min(width, height), f(35 * density));
      const left = f(f(width - size) / 2);
      const top = f(f(height - size) / 2);
      const circle = area(left, top, f(left + size), f(top + size));
      return { face: circle, shadow: null, border: 0, pressed: circle, radius: f(size / 2), oval: true };
    }
    return { face: null, shadow: null, border: 0, pressed: inner, radius: 0, oval: false };
  }

  /** NineSliceLayout.of: [{src, dst}] for a source of srcW×srcH, insets [l, t, r, b], drawn in target at density. */
  function nineSlice(srcW, srcH, insets, pxPerDp, target, density) {
    const [il, it, ir, ib] = insets;
    const tw = f(target[2] - target[0]);
    const th = f(target[3] - target[1]);
    if (il === 0 && it === 0 && ir === 0 && ib === 0) return [{ src: area(0, 0, srcW, srcH), dst: target.map(f) }];
    const scale = f(f(density) / pxPerDp);
    const fit = (a, b, room) => {
      if (f(a + b) <= room) return [a, b];
      const k = f(room / f(a + b));
      return [f(a * k), f(b * k)];
    };
    const [dl, dr] = fit(f(il * scale), f(ir * scale), tw);
    const [dt, db] = fit(f(it * scale), f(ib * scale), th);
    const sx = [0, il, srcW - ir, srcW].map(f);
    const sy = [0, it, srcH - ib, srcH].map(f);
    const dx = [f(target[0]), f(target[0] + dl), f(target[2] - dr), f(target[2])];
    const dy = [f(target[1]), f(target[1] + dt), f(target[3] - db), f(target[3])];
    const out = [];
    const nonEmpty = (a) => f(a[2] - a[0]) > 0 && f(a[3] - a[1]) > 0;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const src = [sx[c], sy[r], sx[c + 1], sy[r + 1]];
        const dst = [dx[c], dy[r], dx[c + 1], dy[r + 1]];
        if (nonEmpty(src) && nonEmpty(dst)) out.push({ src, dst });

  }

  /** PictureWindow.centerCrop: {scale, dx, dy} of a picW×picH picture over a boardW×boardH board. */
  function centerCrop(picW, picH, boardW, boardH) {
    boardW = f(boardW);
    boardH = f(boardH);
    const scale = Math.max(f(boardW / picW), f(boardH / picH));
    return { scale, dx: f(f(boardW - f(picW * scale)) / 2), dy: f(f(boardH - f(picH * scale)) / 2) };

  function pictureUnder(p, a) {

  function pack(a, r, g, b, n) {

  function blurShrink(pixels, width, height, factor) {
    const w = Math.max(1, Math.floor(width / factor));
    const h = Math.max(1, Math.floor(height / factor));
    const fx = Math.min(factor, width);
    const fy = Math.min(factor, height);
    const n = fx * fy;
    const out = new Int32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        let a = 0, r = 0, g = 0, b = 0;
        for (let yy = 0; yy < fy; yy++) {
          for (let xx = 0; xx < fx; xx++) {
            const c = pixels[(y * fy + yy) * width + x * fx + xx];
            a += (c >>> 24) & 0xff; r += (c >>> 16) & 0xff; g += (c >>> 8) & 0xff; b += c & 0xff;
          }

  function blurPass(src, dst, width, height, r, horizontal) {
    const lines = horizontal ? height : width;
    const len = horizontal ? width : height;
    const n = 2 * r + 1;
    // a pixel of the line: along a row 1 apart, down a column width apart; past an end, the end's
    const step = horizontal ? 1 : width;
    const last = len - 1;
    for (let line = 0; line < lines; line++) {
      const base = horizontal ? line * width : line;
      let sa = 0, sr = 0, sg = 0, sb = 0;
      for (let i = -r; i <= r; i++) {
        const c = src[base + (i < 0 ? 0 : i > last ? last : i) * step];
        sa += (c >>> 24) & 0xff; sr += (c >>> 16) & 0xff; sg += (c >>> 8) & 0xff; sb += c & 0xff;
      }
      for (let i = 0; i < len; i++) {
        dst[base + i * step] = pack(sa, sr, sg, sb, n);
        const o = i - r, p = i + r + 1;
        const out = src[base + (o < 0 ? 0 : o > last ? last : o) * step];
        const inn = src[base + (p < 0 ? 0 : p > last ? last : p) * step];
        sa += ((inn >>> 24) & 0xff) - ((out >>> 24) & 0xff);
        sr += ((inn >>> 16) & 0xff) - ((out >>> 16) & 0xff);
        sg += ((inn >>> 8) & 0xff) - ((out >>> 8) & 0xff);
        sb += (inn & 0xff) - (out & 0xff);

  function blurRadius(blurDp, widthPx, bitmapWidth, density) {

      case 90: return [t, srcH - r, b, srcH - l];
      case 180: return [srcW - r, srcH - b, srcW - l, srcH - t];

      case 180: return [srcW - r, srcH - b, srcW - l, srcH - t];

<script id="youmo-maker">
// youmo-maker: the theme maker's document (060-render-p3 §5.1, M1), apart from the page so node tests it:
// a theme 4.0 pack (theme.xml, its files, its layouts/) opened, saved, kept as a draft, undone and redone;

  'use strict';

  const THEME_XML = 'theme.xml';
  const LAYOUTS = 'layouts/';
  const UNDO_LIMIT = 100;

  /** A document: the theme's text, its files by name, its layouts by their path under layouts/ (kept as they are). */
  function doc(xml, files = {}, layouts = {}) {
    // own keys copied one by one: a file named __proto__ stays a file
    const copy = (o) => { const out = Object.create(null); for (const k of Object.keys(o)) out[k] = o[k]; return out; };

    const m = /<theme\b[^>]*?\sname="([^"]*)"/.exec(xml);

  }

  /** [xml] with its <theme>'s name= [name] (one put in where it has none). */

    if (themeName(xml) != null) return xml.replace(/(<theme\b[^>]*?\sname=")[^"]*(")/, (all, a, b) => a + name + b);
    return xml.replace(/<theme\b/, (t) => t + ' name="' + name + '"');

  /** A new document of the app's theme [id] (engine's themeSource), named apart from it so an import adds a theme. */
  function fromBuiltin(E, id) {
    const xml = E.themeSource(id);
    if (xml == null) throw new Error('no built-in theme ' + id);

  }

  const PICTURE = /<picture\b[^>]*?(?:\/>|>[\s\S]*?<\/picture>)/;
  const KEYBOARD_PICTURE = '<style select="keyboard" fill="picture"/>';

  /**
   * A new document of [base] (a document) with [image] (its bytes, [type] png/jpg/webp: [pictureFile]'s) as the
   * keyboard's picture: the source and each orientation's cut the same file, the keyboard showing it. The colours
   * stay [base]'s (picking them from the picture comes with the page's crop and colours, M2/M3). A picture [base] had is replaced, its
   * files dropped where nothing else names them.
   */
  function withPicture(base, image, type) {
    const file = 'picture.' + type;
    const picture = '  <picture src="' + file + '">\n    <cut orientation="portrait" file="' + file + '"/>\n    <cut orientation="landscape" file="' + file + '"/>\n  </picture>';
    let xml = base.xml;
    const files = doc('', base.files).files;
    const old = PICTURE.exec(uncommented(xml));
    if (old) {
      const was = xml.slice(old.index, old.index + old[0].length);
      xml = xml.slice(0, old.index).replace(/[ \t]*$/, '') + xml.slice(old.index + old[0].length).replace(/^[ \t]*\n/, '');

   */
  function saveProblems(L, format, d) {
    const lim = format.limits;
    const out = [];
    const bad = (message) => out.push({ level: 'error', line: 0, message });

    if (name == null || !L.isPlainFileName(name) || name.startsWith('.') || /#(light|dark)$/.test(name)) bad('主题名 "' + name + '" 不能做文件名');
    const xml = uncommented(d.xml);
    const named = new Set();
    for (const m of xml.matchAll(/<(picture|cut|font|icon)\b[^>]*?\b(src|file)="([^"]+)"/g)) named.add(m[3] + '|' + m[1]);

        else if (Math.max(s[0], s[1]) > side) bad(file + ' 太大：' + s[0] + '×' + s[1] + '，最多 ' + side);

  function decodableImages(L, format, files) {

      const lim = format.limits;
      let total = 0;
      const files = Object.create(null);
      const layouts = Object.create(null);
      const notes = [];

        const breach = L.entryBreach(lim, i + 1, e.size, total);
        if (breach) throw new L.ThemeError('limit', breach);
        total += e.size;
        if (e.name.endsWith('/')) continue;
        const parts = L.entryPath(e.name);
        if (parts.length === 1 && parts[0] === THEME_XML) continue;

  const DEVICES = [
    { id: 'oneplus-6t', label: 'OnePlus 6T', w: 1080, h: 2340, density: 2.625 },
    { id: 'pixel-8', label: 'Pixel 8', w: 1080, h: 2400, density: 2.625 },
    { id: 'pixel-8-pro', label: 'Pixel 8 Pro', w: 1344, h: 2992, density: 3.5 },
    { id: 'galaxy-s24', label: 'Galaxy S24', w: 1080, h: 2340, density: 3 },
    { id: 'small', label: '小屏 720p', w: 720, h: 1280, density: 2 },
    { id: 'tablet', label: '平板 10"', w: 1600, h: 2560, density: 2 },

      density: e.density,

    if (e.dark) out.dark = true;

   * What is wrong with [d] drawn on [board] in [env] (EnvJson): `[{level: "error"|"warning", line, message}]`,
   * the theme's own, then the scene's; `theme` and `scene` where they were made.

  function check(E, d, board, env, measurer) {

    add('error', r.problems);

  }

    THEME_XML, UNDO_LIMIT, DEVICES, KEYBOARD_DP, FORMS, BOARDS, ENV,
    doc, themeName, withName, fromBuiltin, withPicture, PICTURE_SAVE, pictureFile, saveProblems, decodableImages, open, save, same, History, keepDraft, draft, dropDraft, idbStore, envJson, check,
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script id="youmo-ui">
// youmo-ui: the maker's page (060-render-p3 §5.1, M1): the top bar, the preview the engine draws, the preview's
// environment, the three ways to start, open and save, the draft, undo and redo, the problems. The document and
// what is done to it are youmo-maker's (node tests them); this part is the controls.
(function () {
  'use strict';
  const E = globalThis['youmo-engine'] && globalThis['youmo-engine'].YoumoEngine;
  const L = window.YoumoLib;
  const M = window.YoumoMaker;
  const json = (id) => JSON.parse(document.getElementById(id).textContent);
  const FORMAT = json('youmo-format');
  const ICONS = json('youmo-engine-icons');
  const $ = (id) => document.getElementById(id);

  const THEME_LABEL = { material: 'Material', pixel: 'Pixel', nord: 'Nord', 'deep-blue': 'Deep Blue', monokai: 'Monokai', 'amoled-black': 'AMOLED', monet: '系统取色' };
  const BOARD_LABEL = { qwerty: '26 键', nine: '九键', k14: '14 键', k18: '18 键', zhuyin: '注音', 'zhuyin-nine': '注音九键', number: '数字', symbols: '符号', handwriting: '手写' };
  const FORM_LABEL = { normal: '普通', compact: '紧凑', floating: '悬浮', left: '单手（左）', right: '单手（右）', split: '分体', flat: '平铺' };
  const IMAGE = /\.(png|jpe?g|webp)$/i;
  const FONT = /\.(ttf|otf)$/i;

  let history = null;
  let env = Object.assign({}, M.ENV);
  let scene = null;
  let pressed = null;
  let assets = { key: null, images: {}, fonts: {}, cuts: {} };
  let loading = 0; // which loadAssets is the latest: an older one finishing late is dropped
  let edited = false; // the draft is kept only once the user has changed something
  let keeping = null;
  const store = (() => { try { return M.idbStore(window.indexedDB); } catch (e) { return null; } })();

  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('on');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('on'), 3500);
  }

  // ---- the document ----

  function set(d, { fresh = false } = {}) {
    if (fresh || !history) history = new M.History(d);
    else if (!history.push(d)) return;
    else edited = true;
    changed();
  }

  // the draft written a moment after the last change, not on every key
  function keep() {
    if (!store || !edited || !history) return;
    clearTimeout(keeping);
    keeping = setTimeout(() => M.keepDraft(store, history.current, env), 500);
  }

  function changed() {
    const d = history.current;
    if ($('source').value !== d.xml) $('source').value = d.xml;
    $('name').textContent = M.themeName(d.xml) || '（无名）';
    $('undo').disabled = !history.canUndo;
    $('redo').disabled = !history.canRedo;
    keep();
    loadAssets(d).then((current) => { if (current) preview(); });
  }

  // the theme's files as the painter takes them: its images decoded, its fonts loaded under a family of their own
  // an image is decoded only where its header says the app would take it: a pack's bytes are not trusted, and a
  // decode past the browser's memory takes the tab down (a draft restored would do it again each time)
  async function loadAssets(d) {
    if (assets.key === d.files) return true;
    const mine = ++loading;
    const images = {};
    const fonts = {};
    const cuts = {};
    const safe = new Set(M.decodableImages(L, FORMAT, d.files));
    for (const [name, bytes] of Object.entries(d.files)) {
      try {
        if (IMAGE.test(name)) {
          if (!safe.has(name)) continue;
          const bmp = await createImageBitmap(new Blob([bytes]));
          images[name] = { image: bmp, width: bmp.width, height: bmp.height };
          cuts[name] = bmp;
        } else if (FONT.test(name)) {
          const family = 'youmo-file-' + L.contentId(bytes);
          if (![...document.fonts].some((f) => f.family === family)) {
            const face = new FontFace(family, bytes);
            await face.load();
            document.fonts.add(face);
          }
          fonts[name] = family;
        }
      } catch (e) {
        // a file the browser cannot decode: the engine draws without it, as the app would refuse it on import
      }
    }
    if (mine !== loading) {
      for (const b of Object.values(cuts)) b.close();
      return false;
    }
    for (const b of Object.values(assets.cuts)) if (!Object.values(cuts).includes(b)) b.close();
    assets = { key: d.files, images, fonts, cuts };
    return true;
  }

  // the <font name=… src=…> of the theme, by the CSS family its file was loaded under
  function fontFamilies(xml) {
    const out = {};
    for (const m of xml.matchAll(/<font\b[^>]*\bname="([^"]+)"[^>]*\bsrc="([^"]+)"/g)) if (assets.fonts[m[2]]) out[m[1]] = assets.fonts[m[2]];
    return out;
  }

  // the theme's picture, the scene's size: its orientation's cut centre-cropped, blurred and dimmed as asked
  function pictureOf(xml) {
    const p = /<picture\b[^>]*>([\s\S]*?)<\/picture>/.exec(xml);
    if (!p) return null;
    const attr = (re, dflt) => { const m = re.exec(p[0]); return m ? parseFloat(m[1]) : dflt; };
    const ownBlur = attr(/\bblur="([\d.]+)dp"/, 0);
    const ownBright = attr(/\bbrightness="([\d.]+)%"/, 100);
    const cut = new RegExp('<cut\\b[^>]*orientation="' + (env.landscape ? 'landscape' : 'portrait') + '"[^>]*file="([^"]+)"').exec(p[1]) ||
      /<cut\b[^>]*file="([^"]+)"/.exec(p[1]);
    const bmp = cut && assets.cuts[cut[1]];
    if (!bmp || !scene) return null;
    const made = new Map();
    return (blurDp, brightness) => {
      const b = blurDp == null ? ownBlur : blurDp;
      const l = brightness == null ? ownBright : brightness;
      const key = b + '/' + l;
      if (made.has(key)) return made.get(key);
      const c = document.createElement('canvas');
      c.width = scene.width;
      c.height = scene.height;
      const g = c.getContext('2d');
      const s = Math.max(c.width / bmp.width, c.height / bmp.height);
      g.filter = 'blur(' + b * env.density + 'px) brightness(' + l + '%)';
      g.drawImage(bmp, (c.width - bmp.width * s) / 2, (c.height - bmp.height * s) / 2, bmp.width * s, bmp.height * s);
      made.set(key, c);
      return c;
    };
  }

  function preview() {
    const d = history.current;
    const canvas = $('preview');
    const fonts = Object.assign({ key: '"Youmo Latin", "Youmo Han", sans-serif' }, fontFamilies(d.xml));
    const m = E.canvasMeasurer(canvas.getContext('2d'), fonts);
    const r = M.check(E, d, env.board, M.envJson(env), m.ok ? m.measurer : null);
    scene = r.scene;
    showProblems(r.problems);
    if (!scene) return;
    canvas.width = scene.width;
    canvas.height = scene.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const state = { pressed, icons: ICONS, images: assets.images, fonts };
    const picture = pictureOf(d.xml);
    if (picture) state.picture = picture;
    E.paint(scene, ctx, state);
  }

  function showProblems(list) {
    const ul = $('problems');
    ul.textContent = '';
    for (const p of list) {
      const li = document.createElement('li');
      li.className = p.level;
      li.textContent = (p.level === 'error' ? '错误' : '警告') + (p.line ? '（第 ' + p.line + ' 行）' : '') + '：' + p.message;
      if (p.line) li.addEventListener('click', () => goToLine(p.line));
      ul.append(li);
    }
    const errors = list.filter((p) => p.level === 'error').length;
    $('count').textContent = list.length ? errors + ' 个错误，' + (list.length - errors) + ' 个警告' : '没有';
  }

  function goToLine(line) {
    const ta = $('source');
    const lines = ta.value.split('\n');
    const start = lines.slice(0, line - 1).reduce((n, l) => n + l.length + 1, 0);
    ta.focus();
    ta.setSelectionRange(start, start + (lines[line - 1] || '').length);
    ta.scrollTop = Math.max(0, (line - 3) * 17);
  }

  // ---- files ----

  function pick(input) {
    return new Promise((ok) => {
      input.value = '';
      input.onchange = () => ok(input.files[0] || null);
      input.click();
    });
  }

  async function openFile() {
    const f = await pick($('open-input'));
    if (!f) return;
    try {
      const { doc, notes } = await M.open(E, L, FORMAT, new Uint8Array(await f.arrayBuffer()));
      set(doc);
      $('new-panel').close();
      for (const n of notes) {
        if (n.kind === 'converted') toast('这是 ' + n.from + ' 主题，已转成 4.0');
        if (n.kind === 'layouts') toast('带自定义布局：' + n.ids.join('、') + '，保存时原样保留');
      }
    } catch (e) {
      toast('打不开这个文件：' + (e.message || e));
    }
  }

  // the picture drawn at [w]×[h] and encoded: JPEG, or PNG where any pixel is see-through
  async function encodePicture(bytes, w, h, quality) {
    const bmp = await createImageBitmap(new Blob([bytes]));
    try {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const g = c.getContext('2d');
      g.drawImage(bmp, 0, 0, w, h);
      const px = g.getImageData(0, 0, w, h).data;
      let alpha = false;
      for (let i = 3; i < px.length && !alpha; i += 4) alpha = px[i] < 255;
      const type = alpha ? 'png' : 'jpg';
      const blob = await new Promise((ok) => c.toBlob(ok, alpha ? 'image/png' : 'image/jpeg', quality));
      return { bytes: new Uint8Array(await blob.arrayBuffer()), type };
    } finally {
      bmp.close();
    }
  }

  async function fromImage() {
    const f = await pick($('image-input'));
    if (!f) return;
    const chosen = document.querySelector('input[name="image-base"]:checked');
    try {
      const made = await M.pictureFile(L, FORMAT, new Uint8Array(await f.arrayBuffer()), encodePicture);
      set(M.withPicture(M.fromBuiltin(E, chosen ? chosen.value : 'material'), made.bytes, made.type));
      $('new-panel').close();
      toast('图片已做键盘背景；配色可在源码里改');
    } catch (e) {
      toast(e && e.code === 'limit' ? '图片太大，打不开' : '这张图片用不了（只认 PNG、JPEG、WebP）');
    }
  }

  function save() {
    if (!history) return;
    const d = history.current;
    const bad = M.check(E, d, env.board, M.envJson(env), null).problems.filter((p) => p.level === 'error');
    if (bad.length) { toast('有 ' + bad.length + ' 个错误，App 导入不了，先改好'); return; }
    const refused = M.saveProblems(L, FORMAT, d);
    if (refused.length) { toast('App 会拒绝导入：' + refused.map((p) => p.message).join('；')); return; }
    const { name, bytes } = M.save(L, d);
    const a = document.createElement('a');
    // octet-stream, as the app exports it: a browser adds no .zip to a name it takes for a zip (specs/app.md)
    a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast(/Android|iPhone/.test(navigator.userAgent) ? '已保存 ' + name + '。打开幽默输入法 → 主题 → 新增主题 → 导入主题文件' : '已保存 ' + name);
  }

  // ---- the environment ----

  function fillEnvForm() {
    $('env-device').value = env.device;
    $('env-w').value = env.w;
    $('env-h').value = env.h;
    $('env-density').value = env.density;
    $('env-landscape').checked = env.landscape;
    $('env-board').value = env.board;
    $('env-form-kind').value = env.form;
    $('env-shift').value = env.shift;
    $('dark').setAttribute('aria-pressed', String(env.dark));
    $('dark').textContent = env.dark ? '深色' : '浅色';
  }

  function readEnvForm(e) {
    if (e && e.target === $('env-device')) {
      const dev = M.DEVICES.find((x) => x.id === $('env-device').value);
      if (dev) Object.assign(env, { device: dev.id, w: dev.w, h: dev.h, density: dev.density });
      else env.device = 'custom';
    } else {
      const num = (id, v) => (Number.isFinite(+$(id).value) && +$(id).value > 0 ? +$(id).value : v);
      Object.assign(env, { w: num('env-w', env.w), h: num('env-h', env.h), density: num('env-density', env.density) });
      if (e && /env-(w|h|density)/.test(e.target.id)) env.device = 'custom';
    }
    Object.assign(env, { landscape: $('env-landscape').checked, board: $('env-board').value, form: $('env-form-kind').value, shift: $('env-shift').value });
    fillEnvForm();
    keep();
    if (history) preview();
  }

  // ---- start ----

  function wire() {
    for (const d of M.DEVICES) $('env-device').add(new Option(d.label + '（' + d.w + '×' + d.h + '）', d.id));
    $('env-device').add(new Option('自定义', 'custom'));
    const boards = new Set(E.layouts());
    for (const b of M.BOARDS) if (boards.has(b)) $('env-board').add(new Option(BOARD_LABEL[b] || b, b));
    for (const f of M.FORMS) $('env-form-kind').add(new Option(FORM_LABEL[f], f));
    $('env-form').addEventListener('change', readEnvForm);
    $('env').addEventListener('click', () => $('env-panel').showModal());
    $('dark').addEventListener('click', () => { env.dark = !env.dark; readEnvForm(); });

    // the picture's colours: a radio group, so a touch picks one (a button's focus is no choice on a phone)
    for (const id of E.themes()) {
      const label = document.createElement('label');
      const r = document.createElement('input');
      r.type = 'radio';
      r.name = 'image-base';
      r.value = id;
      r.checked = id === 'material';
      label.append(r, ' ' + (THEME_LABEL[id] || id));
      $('image-base').append(label);
    }
    const cards = $('builtins');
    for (const id of E.themes()) {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = THEME_LABEL[id] || id;
      b.addEventListener('click', () => { set(M.fromBuiltin(E, id)); $('new-panel').close(); });
      cards.append(b);
    }
    $('from-image').addEventListener('click', fromImage);
    $('from-file').addEventListener('click', openFile);

    $('file').addEventListener('click', () => { $('file-menu').hidden = !$('file-menu').hidden; });
    $('file-menu').addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      $('file-menu').hidden = true;
      if (act === 'new') $('new-panel').showModal();
      else if (act === 'open') openFile();
      else if (act === 'save') save();
    });
    $('undo').addEventListener('click', () => { if (history && history.canUndo) { history.undo(); edited = true; changed(); } });
    $('redo').addEventListener('click', () => { if (history && history.canRedo) { history.redo(); edited = true; changed(); } });
    document.addEventListener('keydown', (e) => {
      if (!(e.ctrlKey || e.metaKey) || e.target === $('source')) return;
      if (e.key === 'z' && !e.shiftKey) { e.preventDefault(); $('undo').click(); }
      else if (e.key === 'y' || (e.key === 'z' && e.shiftKey)) { e.preventDefault(); $('redo').click(); }
    });
    // the source read again as it is typed: one undo step per pause, not per letter
    let typing = null;
    $('source').addEventListener('input', () => {
      clearTimeout(typing);
      typing = setTimeout(() => { if (history) set(M.doc($('source').value, history.current.files, history.current.layouts)); }, 400);
    });

    // a key tapped is the key picked (the editing's 按键 goes to it, M2); held, it shows pressed
    const canvas = $('preview');
    const keyAt = (e) => {
      if (!scene) return null;
      const r = canvas.getBoundingClientRect();
      const k = scene.keyAt((e.clientX - r.left) * scene.width / r.width, (e.clientY - r.top) * scene.height / r.height);
      return k >= 0 ? scene.json().keys[k].id : null;
    };
    canvas.addEventListener('pointerdown', (e) => {
      if (!history) return;
      pressed = keyAt(e);
      $('picked').textContent = pressed ? '选中的键：' + pressed : '';
      preview();
    });
    const up = () => { if (pressed && history) { pressed = null; preview(); } };
    canvas.addEventListener('pointerup', up);
    canvas.addEventListener('pointerleave', up);
  }

  async function start() {
    if (!E) {
      document.body.textContent = '这个页面没有带绘制引擎：./gradlew :lib:keyboard-scene:youmoEngine，再 node web/theme-maker/tools/assemble.mjs --engine';
      return;
    }
    wire();
    try {
      await Promise.all(['400', '700'].flatMap((w) => [document.fonts.load(w + ' 20px "Youmo Latin"', 'a'), document.fonts.load(w + ' 20px "Youmo Han"', '中')]));
    } catch (e) {
      // drawn in the fallback font: measured the same, a little off from the phone's
    }
    const kept = store ? await M.draft(store) : null;
    if (kept) {
      $('restore-text').textContent = '上次的草稿「' + (M.themeName(kept.doc.xml) || '无名') + '」（' + new Date(kept.at).toLocaleString() + '）还在，恢复吗？';
      // Esc or back keeps the draft: only 恢复 or an explicit 丢弃 answers
      $('restore-panel').addEventListener('cancel', (e) => e.preventDefault());
      $('restore-panel').returnValue = '';
      $('restore-panel').showModal();
      const answer = await new Promise((ok) => $('restore-panel').addEventListener('close', () => ok($('restore-panel').returnValue), { once: true }));
      if (answer === 'restore') {
        try {
          if (kept.env) env = Object.assign({}, M.ENV, kept.env);
          fillEnvForm();
          set(kept.doc, { fresh: true });
          await loadAssets(kept.doc);
          preview();
          return;
        } catch (e) {
          history = null;
          env = Object.assign({}, M.ENV);
          if (confirm('草稿打不开（' + (e.message || e) + '），丢弃它吗？')) await M.dropDraft(store);
        }
      } else if (answer === 'discard') await M.dropDraft(store);
    }
    fillEnvForm();
    set(M.fromBuiltin(E, 'material'), { fresh: true });
    $('new-panel').showModal();
  }

  start();
})();
</script>
</body>
</html>
