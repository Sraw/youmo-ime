<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- nothing leaves the browser: no request of any kind, so the line on the page is true; a link someone adds later is refused too -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src blob: data:; font-src blob: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src blob: data:">
<meta name="color-scheme" content="light dark">
<title>幽默输入法 · 主题制作</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2024; --muted: #5f6670; --line: #dde1e6;
  --accent: #3b6fd8; --accent-ink: #ffffff; --warn: #9a6400; --warn-bg: #fff4d6; --err: #b3261e;
  --sel: #ff8a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1f2226; --ink: #e6e8eb; --muted: #a0a7b0; --line: #343941;
    --accent: #8fb2ff; --accent-ink: #0b1a33; --warn: #ffcf6b; --warn-bg: #3a2f12; --err: #ffb4ab;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1f2226; --ink: #e6e8eb; --muted: #a0a7b0; --line: #343941;
  --accent: #8fb2ff; --accent-ink: #0b1a33; --warn: #ffcf6b; --warn-bg: #3a2f12; --err: #ffb4ab;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
button, select, input { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  min-height: 34px;
}
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 8px; min-height: 34px; }
input[type="number"], input[type="text"] {
  border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 4px 6px; min-height: 30px;
}
input[type="number"] { width: 64px; }
input[type="range"] { width: 140px; accent-color: var(--accent); vertical-align: middle; }
input[type="color"] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; vertical-align: middle; }

header.top {
  display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
header.top h1 { font-size: 17px; margin: 0 auto 0 0; font-weight: 650; }
header.top .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.privacy { font-size: 12px; color: var(--muted); padding: 4px 16px; border-bottom: 1px solid var(--line); }

main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 520px); gap: 0; align-items: start; }
.preview-col { padding: 12px 16px; position: sticky; top: 0; align-self: start; max-height: 100vh; overflow: auto; }
.settings-col { padding: 12px 16px 48px; border-left: 1px solid var(--line); background: var(--panel); min-height: calc(100vh - 100px); }

.view-opts summary { cursor: pointer; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.view-opts[open] summary { margin-bottom: 10px; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; margin-bottom: 10px; }
.controls label.k { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; min-height: 30px; padding: 4px 10px; border-right: 1px solid var(--line); background: var(--panel); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .35; }

.stage { position: relative; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); }
.stage svg { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage-note { font-size: 12px; color: var(--muted); margin-top: 6px; }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 10px; }
.tabs button[aria-selected="true"] { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
.subtabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.subtabs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

h3 { font-size: 14px; margin: 18px 0 8px; }
h3:first-child { margin-top: 4px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 6px 0; }
.row > .k { min-width: 72px; color: var(--muted); }
.row label { display: inline-flex; align-items: center; gap: 4px; }
.hint { font-size: 12px; color: var(--muted); margin: 4px 0; }
.warn { font-size: 12px; color: var(--warn); background: var(--warn-bg); border-radius: 6px; padding: 4px 8px; margin: 4px 0; }
.err { color: var(--err); }
.val { min-width: 48px; display: inline-block; font-variant-numeric: tabular-nums; }

.color-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px; align-items: center; margin: 4px 0; }
.color-row .name { font-size: 13px; }
.color-row .name small { display: block; color: var(--muted); font-size: 11px; }
.color-row input[type="text"] { width: 104px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.color-row input[type="range"] { width: 72px; }
.follow { font-size: 11px; color: var(--muted); }
.follow button { font-size: 11px; min-height: 22px; padding: 0 6px; }

.thumb { max-width: 100%; max-height: 160px; border-radius: 8px; border: 1px solid var(--line); display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--bg); cursor: pointer; min-height: 26px; }
.chip.unknown { border-style: dashed; }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; width: 120px; display: inline-block; vertical-align: middle; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.over i { background: var(--err); }

.ninebox { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.ninebox svg { border: 1px solid var(--line); border-radius: 6px; background: repeating-conic-gradient(#8882 0% 25%, transparent 0% 50%) 50% / 12px 12px; touch-action: none; }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--ink); padding: 16px; max-width: min(96vw, 900px); width: 96vw; }
dialog::backdrop { background: #0008; }
.crop-area { position: relative; touch-action: none; user-select: none; margin: 8px auto; }
.crop-area canvas { display: block; width: 100%; height: 100%; }
.crop-frame { position: absolute; border: 2px solid #fff; box-shadow: 0 0 0 9999px #0009; cursor: move; }
.crop-frame .h { position: absolute; right: -9px; bottom: -9px; width: 18px; height: 18px; background: #fff; border-radius: 50%; cursor: nwse-resize; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; max-width: min(92vw, 560px); z-index: 10; font-size: 13px; }
.toast.err { background: var(--err); color: #fff; }

@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .preview-col { position: sticky; top: 0; z-index: 2; background: var(--bg); max-height: 62vh; border-bottom: 1px solid var(--line); }
  .settings-col { border-left: 0; }
  header.top h1 { font-size: 15px; width: 100%; }
  .controls { grid-template-columns: auto 1fr; }
}
</style>

<script id="youmo-lib">
// youmo-lib: the theme maker's code that touches no page — zip, the theme file, the app's drawing
// rules. Run as it is by the page and by test/format.test.mjs (node:vm), so it uses only what both
// have: TextEncoder/TextDecoder, DecompressionStream, Math.
(function (root) {
  'use strict';

  // ---- errors the page tells apart ----
  class ThemeError extends Error {
    // code: not-theme | newer | older | bad | missing | limit
    constructor(code, detail) {
      super(code + (detail ? ': ' + detail : ''));
      this.code = code;
      this.detail = detail || '';
    }
  }

  // ---- CRC-32 ----
  const CRC_TABLE = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }

  // ---- zip: written STORED at a fixed time, so the same input is the same bytes ----
  // 2026-01-01 00:00 as DOS time and date, as the app's test fixtures are stamped
  const DOS_TIME = 0;
  const DOS_DATE = ((2026 - 1980) << 9) | (1 << 5) | 1;

  /** entries: [[name, Uint8Array]] → the zip's bytes; names UTF-8 (flag bit 11), CRC and sizes in the local header. */
  function writeZip(entries) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;
    for (const [name, data] of entries) {
      const nameBytes = enc.encode(name);
      const crc = crc32(data);
      const local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 10, true); // version needed: 1.0
      local.setUint16(6, 0x0800, true); // UTF-8 names
      local.setUint16(8, 0, true); // STORED
      local.setUint16(10, DOS_TIME, true);
      local.setUint16(12, DOS_DATE, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, data.length, true);
      local.setUint32(22, data.length, true);
      local.setUint16(26, nameBytes.length, true);
      local.setUint16(28, 0, true);
      parts.push(new Uint8Array(local.buffer), nameBytes, data);
      const cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true); // made by: MS-DOS, 2.0
      cd.setUint16(6, 10, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint16(10, 0, true);
      cd.setUint16(12, DOS_TIME, true);
      cd.setUint16(14, DOS_DATE, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, data.length, true);
      cd.setUint32(24, data.length, true);
      cd.setUint16(28, nameBytes.length, true);
      // extra, comment, disk, internal attributes 0
      cd.setUint32(38, 0, true); // external attributes
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), nameBytes);
      offset += 30 + nameBytes.length + data.length;
    }
    const cdSize = central.reduce((s, p) => s + p.length, 0);
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    const all = parts.concat(central, [new Uint8Array(end.buffer)]);
    const out = new Uint8Array(all.reduce((s, p) => s + p.length, 0));
    let at = 0;
    for (const p of all) {
      out.set(p, at);
      at += p.length;
    }
    return out;
  }

  async function inflateRaw(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /**
   * A zip's entries by its central directory (so an entry with a data descriptor, as the app writes
   * them, reads too): [{name, read: async () => Uint8Array}]. STORED and DEFLATE.
   */
  function readZip(bytes) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    let eocd = -1;
    for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 22 - 65535); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) {
        eocd = i;
        break;
      }
    }
    if (eocd < 0) throw new ThemeError('not-theme', 'not a zip');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder();
    const out = [];
    for (let n = 0; n < count; n++) {
      if (p + 46 > bytes.length || dv.getUint32(p, true) !== 0x02014b50) throw new ThemeError('not-theme', 'bad central directory');
      const flags = dv.getUint16(p + 8, true);
      const method = dv.getUint16(p + 10, true);
      const crc = dv.getUint32(p + 16, true);
      const size = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const commentLen = dv.getUint16(p + 32, true);
      const local = dv.getUint32(p + 42, true);
      const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
      p += 46 + nameLen + extraLen + commentLen;
      if (flags & 1) throw new ThemeError('not-theme', 'encrypted');
      out.push({
        name,
        size: dv.getUint32(p - 46 - nameLen - extraLen - commentLen + 24, true),
        async read() {
          if (dv.getUint32(local, true) !== 0x04034b50) throw new ThemeError('not-theme', 'bad local header');
          const start = local + 30 + dv.getUint16(local + 26, true) + dv.getUint16(local + 28, true);
          const raw = bytes.subarray(start, start + size);
          let data;
          if (method === 0) data = raw.slice();
          else if (method === 8) data = await inflateRaw(raw);
          else throw new ThemeError('not-theme', 'compression ' + method);
          if (crc32(data) !== crc) throw new ThemeError('not-theme', 'CRC of ' + name);
          return data;
        },
      });
    }
    return out;
  }

  // ---- the theme file ----
  // format: the youmo-format block (the app's ThemeMakerFormatTest holds it to ThemeFileJson's fields)

  function typeOf(v) {
    if (v === null) return 'null';
    if (Array.isArray(v)) return 'array';
    return typeof v;
  }

  /** [v] checked against the type [t] of [format] (strictly, as the app's Json reads): what is wrong, by path. */
  function check(format, t, v, path) {
    if (t.endsWith('?')) {
      if (v === null) return;
      t = t.slice(0, -1);
    }
    const bad = (why) => {
      throw new ThemeError('bad', path + ': ' + why);
    };
    if (v === null || v === undefined) bad('missing');
    if (t === 'int') {
      if (!Number.isInteger(v) || v < -2147483648 || v > 2147483647) bad('not an int');
      return;
    }
    if (t === 'string') {
      if (typeof v !== 'string') bad('not a string');
      return;
    }
    if (t === 'boolean') {
      if (typeof v !== 'boolean') bad('not a boolean');
      return;
    }
    if (t.startsWith('[')) {
      if (!Array.isArray(v)) bad('not a list');
      v.forEach((x, i) => check(format, t.slice(1, -1), x, path + '[' + i + ']'));
      return;
    }
    if (t.startsWith('{')) {
      if (typeOf(v) !== 'object') bad('not an object');
      for (const k of Object.keys(v)) check(format, t.slice(1, -1), v[k], path + '[' + JSON.stringify(k) + ']');
      return;
    }
    const def = format.types[t];
    if (!def) throw new Error('no type ' + t);
    if (def['@enum']) {
      if (!def['@enum'].includes(v)) bad('not one of ' + def['@enum'].join(', '));
      return;
    }
    if (typeOf(v) !== 'object') bad('not an object');
    let fields = def;
    if (def['@sealed']) {
      if (!Object.prototype.hasOwnProperty.call(def['@sealed'], v.type)) bad('type ' + JSON.stringify(v.type) + ' not known');
      fields = def['@sealed'][v.type];
    }
    for (const k of Object.keys(v)) {
      if (def['@sealed'] && k === 'type') continue;
      if (!Object.prototype.hasOwnProperty.call(fields, k)) bad('field ' + JSON.stringify(k) + ' not known');
    }
    for (const k of Object.keys(fields)) {
      if (!Object.prototype.hasOwnProperty.call(v, k)) bad('field ' + JSON.stringify(k) + ' missing');
      check(format, fields[k], v[k], path + '.' + k);
    }
  }

  /** [v] with its keys in the format's order: the order the app writes (version first). */
  function ordered(format, t, v) {
    if (t.endsWith('?')) {
      if (v === null) return null;
      t = t.slice(0, -1);
    }
    if (t === 'int' || t === 'string' || t === 'boolean') return v;
    if (t.startsWith('[')) return v.map((x) => ordered(format, t.slice(1, -1), x));
    if (t.startsWith('{')) {
      const o = {};
      for (const k of Object.keys(v)) o[k] = ordered(format, t.slice(1, -1), v[k]);
      return o;
    }
    const def = format.types[t];
    if (def['@enum']) return v;
    const o = {};
    let fields = def;
    if (def['@sealed']) {
      o.type = v.type;
      fields = def['@sealed'][v.type];
    }
    for (const k of Object.keys(fields)) o[k] = ordered(format, fields[k], v[k]);
    return o;
  }

  const BOARD_SYNTAX = /^[a-z0-9]+(-[a-z0-9]+)*$/;

  /** A key name read as KeyNames.parse does: {board, key}; one not board/key throws. */
  function parseKeyName(text) {
    const slash = text.indexOf('/');
    if (slash <= 0) throw new ThemeError('bad', 'key name "' + text + '" is not board/key');
    const board = text.substring(0, slash);
    const key = text.substring(slash + 1);
    if (!(board === '*' || BOARD_SYNTAX.test(board))) throw new ThemeError('bad', 'key name "' + text + '" has a bad board');
    if (key.length === 0 || /\s/.test(key)) throw new ThemeError('bad', 'key name "' + text + '" has a bad key');
    return { board, key };
  }

  /** Whether [names] (KeyNames: {roles, positions}) know the name, as KeyNames.isKnown. */
  function isKnownKeyName(names, text) {
    const { board, key } = parseKeyName(text);
    if (board === '*') return names.roles.includes(key);
    const pos = names.positions[board];
    return !!pos && (pos.includes(key) || names.roles.includes(key));
  }

  function inRange(v, lo, hi, what) {
    if (v < lo || v > hi) throw new ThemeError('bad', what + ' ' + v + ' out of ' + lo + '..' + hi);
  }

  /** What ThemeLook refuses as it is made: ranges, quarter turns, a picture shown but none, key names. */
  function checkRanges(format, theme) {
    const L = format.limits;
    const pic = theme.picture;
    const shows = (f) => f && f.type === 'picture';
    const k = theme.keys;
    const kinds = [k.letter, k.function, k.space, k.enter];
    const showsPicture = theme.base.type === 'picture' || theme.bar.type === 'picture' ||
      kinds.some((s) => shows(s.fill)) || Object.values(k.overrides).some((o) => shows(o.fill));
    if (!pic && showsPicture) throw new ThemeError('bad', 'the picture is shown but there is none');
    const blur = (v, w) => inRange(v, 0, L.blurDp, w + '.blurDp');
    const bright = (v, w) => inRange(v, 0, 100, w + '.brightness');
    const crop = (c, w) => {
      if (c.rotation % 90 !== 0 || c.rotation < 0 || c.rotation > 270) throw new ThemeError('bad', w + ' rotation ' + c.rotation + ' is not a quarter turn');
    };
    if (pic) {
      bright(pic.brightness, 'picture');
      blur(pic.blurDp, 'picture');
      crop(pic.portrait, 'portrait');
      if (pic.landscape) crop(pic.landscape, 'landscape');
    }
    if (theme.bar.type === 'picture') {
      blur(theme.bar.blurDp, 'bar');
      bright(theme.bar.brightness, 'bar');
    }
    const slice = (s, w) => {
      if (s.insets.length !== 4) throw new ThemeError('bad', w + ': insets are left, top, right, bottom');
      if (s.insets.some((x) => x < 0)) throw new ThemeError('bad', w + ': negative insets');
      inRange(s.pxPerDp, 1, L.pxPerDp, w + '.pxPerDp');
    };
    const fill = (f, w) => {
      if (!f) return;
      if (f.type === 'image') slice(f, w);
      if (f.type === 'picture') {
        blur(f.blurDp, w);
        bright(f.brightness, w);
      }
    };
    const pressed = (p, w) => {
      if (p && p.type === 'image') slice(p, w);
    };
    inRange(k.radiusDp, 0, L.radiusDp, 'radiusDp');
    inRange(k.borderDp, 0, L.borderDp, 'borderDp');
    inRange(k.shadowDp, 0, L.shadowDp, 'shadowDp');
    for (const g of ['h', 'v', 'hLand', 'vLand']) inRange(k.gap[g], 0, L.gapDp, 'gap.' + g);
    for (const kind of ['letter', 'function', 'space', 'enter']) {
      fill(k[kind].fill, kind);
      pressed(k[kind].pressed, kind);
    }
    for (const [name, o] of Object.entries(k.overrides)) {
      parseKeyName(name);
      fill(o.fill, name);
      pressed(o.pressed, name);
    }
    if (!L.weights.includes(theme.text.keyWeight) || !L.weights.includes(theme.text.candidateWeight)) {
      throw new ThemeError('bad', 'a weight not in ' + L.weights.join(', '));
    }
    inRange(theme.text.keyScale, L.keyScale[0], L.keyScale[1], 'keyScale');
  }

  /** The files a theme names, each once, in the order the app exports them (ThemeLook.files). */
  function lookFiles(theme) {
    const out = [];
    const add = (f) => {
      if (f && !out.includes(f)) out.push(f);
    };
    const img = (x) => (x && x.type === 'image' ? x.file : null);
    const p = theme.picture;
    if (p) {
      add(p.src);
      add(p.portrait.file);
      if (p.landscape) add(p.landscape.file);
    }
    const k = theme.keys;
    for (const s of [k.letter, k.function, k.space, k.enter]) {
      add(img(s.fill));
      add(img(s.pressed));
    }
    for (const o of Object.values(k.overrides)) {
      add(img(o.fill));
      add(img(o.pressed));
    }
    add(theme.text.keyFont);
    add(theme.text.candidateFont);
    return out;
  }

  /** The theme file's text as the app writes it: compact, version first, fields in the app's order. */
  function writeTheme(format, theme) {
    const body = ordered(format, 'ThemeFile', theme);
    return JSON.stringify(Object.assign({ version: format.version }, body));
  }

  const PALETTE_21 = [
    'backgroundColor', 'barColor', 'keyboardColor', 'keyBackgroundColor', 'keyTextColor', 'candidateTextColor',
    'candidateLabelColor', 'candidateCommentColor', 'altKeyBackgroundColor', 'altKeyTextColor',
    'accentKeyBackgroundColor', 'accentKeyTextColor', 'keyPressHighlightColor', 'keyShadowColor',
    'popupBackgroundColor', 'popupTextColor', 'spaceBarColor', 'dividerColor', 'clipboardEntryColor',
    'genericActiveBackgroundColor', 'genericActiveForegroundColor',
  ];

  /** The look of a theme that sets none but its colours (LookDefaults), keys and text by the format's defaults. */
  function defaultLook(format, name, isDark, palette, picture) {
    return {
      name,
      isDark,
      palette,
      picture: picture || null,
      base: { type: picture ? 'picture' : 'color' },
      bar: { type: 'transparent' },
      keys: JSON.parse(JSON.stringify(format.defaults.keys)),
      text: JSON.parse(JSON.stringify(format.defaults.text)),
    };
  }

  /** A 2.1 theme file (an app before 3.0 wrote it) as 3.0: CustomThemeSerializer's from21, the same json. */
  function from21(format, obj) {
    const need = (k) => {
      if (!(k in obj)) throw new ThemeError('bad', 'field ' + k + ' missing');
      return obj[k];
    };
    const int = (v, w) => {
      if (!Number.isInteger(v)) throw new ThemeError('bad', w + ' not an int');
      return v | 0;
    };
    const palette = {};
    for (const k of PALETTE_21) palette[k] = int(need(k), k);
    palette.keyBorderColor = palette.keyShadowColor;
    palette.keyHintColor = palette.altKeyTextColor;
    palette.toolbarIconColor = palette.altKeyTextColor;
    let picture = null;
    const image = obj.backgroundImage;
    if (image && typeOf(image) === 'object') {
      let rect = null;
      if (image.cropRect && typeOf(image.cropRect) === 'object') {
        // an edge left out was -1 (the old Rect reader's), not a refused theme
        const side = (k) => (k in image.cropRect ? int(image.cropRect[k], 'cropRect.' + k) : -1);
        rect = { bottom: side('bottom'), left: side('left'), right: side('right'), top: side('top') };
      }
      if (!('srcFilePath' in image) || !('croppedFilePath' in image)) throw new ThemeError('bad', 'backgroundImage without its files');
      picture = {
        src: String(image.srcFilePath),
        portrait: {
          file: String(image.croppedFilePath),
          cropRect: rect,
          rotation: 'cropRotation' in image ? int(image.cropRotation, 'cropRotation') : 0,
        },
        landscape: null,
        brightness: 'brightness' in image ? int(image.brightness, 'brightness') : 70,
        blurDp: 0,
      };
    }
    if (typeof need('name') !== 'string') throw new ThemeError('bad', 'name not a string');
    if (typeof need('isDark') !== 'boolean') throw new ThemeError('bad', 'isDark not a boolean');
    const theme = defaultLook(format, obj.name, obj.isDark, palette, picture);
    checkRanges(format, theme);
    return theme;
  }

  /**
   * A theme file's text read: {theme, migrated}. 3.0 as the app reads it (every field, none more);
   * 2.1 brought to 3.0 as the app does; older ones and newer ones refused, each with its code.
   */
  function readTheme(format, text) {
    let obj;
    try {
      obj = JSON.parse(text);
    } catch (e) {
      throw new ThemeError('not-theme', 'not json');
    }
    if (typeOf(obj) !== 'object') throw new ThemeError('not-theme', 'not an object');
    const version = 'version' in obj ? String(obj.version) : '1.0';
    if (version === format.version) {
      const body = Object.assign({}, obj);
      delete body.version;
      check(format, 'ThemeFile', body, '$');
      checkRanges(format, body);
      return { theme: ordered(format, 'ThemeFile', body), migrated: false };
    }
    if (format.migrates.includes(version)) return { theme: from21(format, obj), migrated: true };
    if (format.older.includes(version)) throw new ThemeError('older', version);
    throw new ThemeError('newer', version);
  }

  /**
   * A theme zip opened: the json at its top (one; folders and Mac's `._` files passed over, as the
   * app does) and every file it names. {theme, migrated, files: {name: Uint8Array}}.
   */
  async function openZip(format, bytes) {
    const entries = readZip(bytes).filter((e) => !e.name.includes('/') && !e.name.startsWith('._'));
    const jsons = entries.filter((e) => e.name.endsWith('.json'));
    if (jsons.length !== 1) throw new ThemeError('not-theme', jsons.length + ' json files');
    const { theme, migrated } = readTheme(format, new TextDecoder().decode(await jsons[0].read()));
    const files = {};
    for (const name of lookFiles(theme)) {
      const e = entries.find((x) => x.name === name);
      if (!e) throw new ThemeError('missing', name);
      files[name] = await e.read();
    }
    return { theme, migrated, files };
  }

  /** The zip of [theme] and its [files] ({name: Uint8Array}), as the app exports one: each file once, the json last. */
  function exportZip(format, theme, files) {
    const names = lookFiles(theme);
    const entries = names.map((n) => {
      if (!files[n]) throw new ThemeError('missing', n);
      return [n, files[n]];
    });
    entries.push([theme.name + '.json', new TextEncoder().encode(writeTheme(format, theme))]);
    return writeZip(entries);
  }

  /** What the app refuses as it imports (ThemeAssetLimits), checked before a zip is offered: [{what, detail}]. */
  function limitBreaches(format, theme, files, sizes) {
    const L = format.limits;
    const out = [];
    const names = lookFiles(theme);
    if (names.length + 1 > L.entries) out.push({ what: 'entries', detail: names.length + 1 });
    let total = 0;
    for (const n of names) {
      const len = files[n] ? files[n].length : 0;
      total += len;
      if (len > L.fileBytes) out.push({ what: 'fileBytes', detail: n });
    }
    if (total > L.totalBytes) out.push({ what: 'totalBytes', detail: total });
    if (Object.keys(theme.keys.overrides).length > L.overrides) out.push({ what: 'overrides', detail: Object.keys(theme.keys.overrides).length });
    const pic = theme.picture;
    if (pic) {
      for (const c of [pic.portrait, pic.landscape]) {
        const s = c && sizes[c.file];
        if (s && Math.max(s[0], s[1]) > L.pictureSide) out.push({ what: 'pictureSide', detail: c.file });
      }
    }
    for (const n of keyImageFiles(theme)) {
      const s = sizes[n];
      if (s && Math.max(s[0], s[1]) > L.keyImageSide) out.push({ what: 'keyImageSide', detail: n });
      if (files[n] && files[n].length > L.keyImageBytes) out.push({ what: 'keyImageBytes', detail: n });
    }
    return out;
  }

  function keyImageFiles(theme) {
    const out = new Set();
    const img = (x) => x && x.type === 'image' && out.add(x.file);
    const k = theme.keys;
    for (const s of [k.letter, k.function, k.space, k.enter]) {
      img(s.fill);
      img(s.pressed);
    }
    for (const o of Object.values(k.overrides)) {
      img(o.fill);
      img(o.pressed);
    }
    return [...out];
  }

  // ---- the app's drawing rules, as ime-core computes them (Float arithmetic: Math.fround each step) ----
  const f = Math.fround;

  function area(l, t, r, b) {
    return [f(l), f(t), f(r), f(b)];
  }

  /**
   * KeyFaceGeometry.of: {face, shadow, border, pressed, radius, oval}; areas [l, t, r, b]. With [own]
   * (a key's Border, the layout's b: default | on | off | special) the four-argument of(): on a face
   * though the keys are flat, off none, special its kind's when flat, default a letter's when flat.
   */
  function keyFace(width, height, kind, keys, landscape, density, margin = true, own) {
    if (own === 'on') return keyFace(width, height, kind, { ...keys, blocks: true }, landscape, density, margin);
    if (own === 'off') return { ...keyFace(width, height, kind, keys, landscape, density, margin), face: null, shadow: null, border: 0, oval: false };
    if (own === 'default' && !keys.blocks) return keyFace(width, height, 'letter', keys, landscape, density, margin);
    width = f(width);
    height = f(height);
    density = f(density);
    const h = !margin ? 0 : f((landscape ? keys.gap.hLand : keys.gap.h) * density);
    const v = !margin ? 0 : f((landscape ? keys.gap.vLand : keys.gap.v) * density);
    const inner = area(h, v, f(width - h), f(height - v));
    if (keys.blocks) {
      const radius = f(keys.radiusDp * density);
      const shadow = keys.shadowDp > 0 ? [inner[0], inner[1], inner[2], f(inner[3] + f(keys.shadowDp * density))] : null;
      return { face: inner, shadow, border: f(keys.borderDp * density), pressed: inner, radius, oval: false };
    }
    if (kind === 'space') {
      const minHeight = f(26 * density);
      const hInset = f(10 * density);
      const vInset = height < minHeight ? 0 : Math.min(f(f(height - minHeight) / 2), f(16 * density));
      const bar = area(hInset, vInset, f(width - hInset), f(height - vInset));
      return { face: bar, shadow: null, border: 0, pressed: bar, radius: f(3 * density), oval: false };
    }
    if (kind === 'enter') {
      const size = Math.min(Math.min(width, height), f(35 * density));
      const left = f(f(width - size) / 2);
      const top = f(f(height - size) / 2);
      const circle = area(left, top, f(left + size), f(top + size));
      return { face: circle, shadow: null, border: 0, pressed: circle, radius: f(size / 2), oval: true };
    }
    return { face: null, shadow: null, border: 0, pressed: inner, radius: 0, oval: false };
  }

  /** NineSliceLayout.of: [{src, dst}] for a source of srcW×srcH, insets [l, t, r, b], drawn in target at density. */
  function nineSlice(srcW, srcH, insets, pxPerDp, target, density) {
    const [il, it, ir, ib] = insets;
    const tw = f(target[2] - target[0]);
    const th = f(target[3] - target[1]);
    if (il === 0 && it === 0 && ir === 0 && ib === 0) return [{ src: area(0, 0, srcW, srcH), dst: target.map(f) }];
    const scale = f(f(density) / pxPerDp);
    const fit = (a, b, room) => {
      if (f(a + b) <= room) return [a, b];
      const k = f(room / f(a + b));
      return [f(a * k), f(b * k)];
    };
    const [dl, dr] = fit(f(il * scale), f(ir * scale), tw);
    const [dt, db] = fit(f(it * scale), f(ib * scale), th);
    const sx = [0, il, srcW - ir, srcW].map(f);
    const sy = [0, it, srcH - ib, srcH].map(f);
    const dx = [f(target[0]), f(target[0] + dl), f(target[2] - dr), f(target[2])];
    const dy = [f(target[1]), f(target[1] + dt), f(target[3] - db), f(target[3])];
    const out = [];
    const has = (a) => f(a[2] - a[0]) > 0 && f(a[3] - a[1]) > 0;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const src = [sx[c], sy[r], sx[c + 1], sy[r + 1]];
        const dst = [dx[c], dy[r], dx[c + 1], dy[r + 1]];
        if (has(src) && has(dst)) out.push({ src, dst });
      }
    }
    return out;
  }

  /** PictureWindow.centerCrop: {scale, dx, dy} of a picW×picH picture over a boardW×boardH board. */
  function centerCrop(picW, picH, boardW, boardH) {
    boardW = f(boardW);
    boardH = f(boardH);
    const scale = Math.max(f(boardW / picW), f(boardH / picH));
    return { scale, dx: f(f(boardW - f(picW * scale)) / 2), dy: f(f(boardH - f(picH * scale)) / 2) };
  }

  /** PictureWindow.under: the picture's pixels under [a] of the board. */
  function pictureUnder(p, a) {
    return [
      f(f(a[0] - p.dx) / p.scale), f(f(a[1] - p.dy) / p.scale),
      f(f(a[2] - p.dx) / p.scale), f(f(a[3] - p.dy) / p.scale),
    ];
  }

  // BoxBlur: 0xAARRGGBB ints (signed, as Kotlin's), three box passes across then down
  function pack(s, n) {
    const ch = (v) => Math.floor((v * 2 + n) / (2 * n));
    return (ch(s[0]) << 24) | (ch(s[1]) << 16) | (ch(s[2]) << 8) | ch(s[3]);
  }

  function addPx(s, c, sign) {
    s[0] += sign * ((c >>> 24) & 0xff);
    s[1] += sign * ((c >>> 16) & 0xff);
    s[2] += sign * ((c >>> 8) & 0xff);
    s[3] += sign * (c & 0xff);
  }

  function blurShrink(pixels, width, height, factor) {
    const w = Math.max(1, Math.floor(width / factor));
    const h = Math.max(1, Math.floor(height / factor));
    const fx = Math.min(factor, width);
    const fy = Math.min(factor, height);
    const n = fx * fy;
    const out = new Int32Array(w * h);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const s = [0, 0, 0, 0];
        for (let yy = 0; yy < fy; yy++) for (let xx = 0; xx < fx; xx++) addPx(s, pixels[(y * fy + yy) * width + x * fx + xx], 1);
        out[y * w + x] = pack(s, n);
      }
    }
    return out;
  }

  function blurPass(src, dst, width, height, r, horizontal) {
    const lines = horizontal ? height : width;
    const len = horizontal ? width : height;
    const n = 2 * r + 1;
    const clamp = (i) => (i < 0 ? 0 : i > len - 1 ? len - 1 : i);
    for (let line = 0; line < lines; line++) {
      const at = horizontal ? (i) => src[line * width + clamp(i)] : (i) => src[clamp(i) * width + line];
      const s = [0, 0, 0, 0];
      for (let i = -r; i <= r; i++) addPx(s, at(i), 1);
      for (let i = 0; i < len; i++) {
        dst[horizontal ? line * width + i : i * width + line] = pack(s, n);
        addPx(s, at(i - r), -1);
        addPx(s, at(i + r + 1), 1);
      }
    }
  }

  function blur(pixels, width, height, radius) {
    const cur = Int32Array.from(pixels);
    if (radius === 0) return cur;
    const tmp = new Int32Array(cur.length);
    for (let p = 0; p < 3; p++) {
      blurPass(cur, tmp, width, height, radius, true);
      blurPass(tmp, cur, width, height, radius, false);
    }
    return cur;
  }

  /** KeyStyleResolver.resolve: the key's own, then a role's on every board, then its kind. */
  function resolveStyle(keys, board, key, kind, roles) {
    const own = board != null && key != null ? keys.overrides[board + '/' + key] : null;
    const all = key != null && roles.includes(key) ? keys.overrides['*/' + key] : null;
    const style = keys[kind];
    const pick = (field) => (own && own[field]) || (all && all[field]) || null;
    return {
      fill: pick('fill') || style.fill,
      pressed: pick('pressed') || style.pressed,
      label: (own && own.label) || (all && all.label) || 'show',
    };
  }

  /** KeyStyleResolver.imagesOn: the image files a board with keys [names] draws, each once. */
  function imagesOn(keys, board, names, roles) {
    const out = [];
    const add = (fill, pressed) => {
      for (const x of [fill, pressed]) if (x && x.type === 'image' && !out.includes(x.file)) out.push(x.file);
    };
    for (const s of [keys.letter, keys.function, keys.space, keys.enter]) add(s.fill, s.pressed);
    for (const key of names) {
      if (roles.includes(key)) {
        const o = keys.overrides['*/' + key];
        if (o) add(o.fill, o.pressed);
      }
      const o = keys.overrides[board + '/' + key];
      if (o) add(o.fill, o.pressed);
    }
    return out;
  }

  /** KeyImageBudget: bytes of [images] ([{file, width, height}]) decoded at [sample], a file once. */
  function budgetBytes(images, sample = 1) {
    const seen = new Set();
    let sum = 0;
    for (const im of images) {
      if (seen.has(im.file)) continue;
      seen.add(im.file);
      sum += Math.max(1, Math.floor(im.width / sample)) * Math.max(1, Math.floor(im.height / sample)) * 4;
    }
    return sum;
  }

  function budgetSample(images, limit) {
    let sample = 1;
    while (budgetBytes(images, sample) > limit && sample < 64) sample *= 2;
    return sample;
  }

  // ---- colours: 0xAARRGGBB as a signed int, as the theme file has them ----
  function argb(a, r, g, b) {
    return ((a & 0xff) << 24) | ((r & 0xff) << 16) | ((g & 0xff) << 8) | (b & 0xff);
  }

  function channels(c) {
    return { a: (c >>> 24) & 0xff, r: (c >>> 16) & 0xff, g: (c >>> 8) & 0xff, b: c & 0xff };
  }

  function toHex(c) {
    return '#' + (c >>> 0).toString(16).padStart(8, '0').toUpperCase();
  }

  /** #AARRGGBB, #RRGGBB (opaque), with or without the #; null when it is neither. */
  function fromHex(text) {
    const m = /^#?([0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/.exec(text.trim());
    if (!m) return null;
    const h = m[1].length === 6 ? 'ff' + m[1] : m[1];
    return parseInt(h, 16) | 0;
  }

  function css(c) {
    const { a, r, g, b } = channels(c);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + +(a / 255).toFixed(4) + ')';
  }

  function withAlpha(c, alpha) {
    return (c & 0xffffff) | (Math.round(alpha * 255) << 24);
  }

  // Contrast.ratio's: [fg] drawn over [bg] (its alpha) against bg
  function blend(a, b, t) {
    const x = channels(a);
    const y = channels(b);
    const ch = (p, q) => Math.max(0, Math.min(255, Math.trunc(p + (q - p) * t)));
    return argb(255, ch(x.r, y.r), ch(x.g, y.g), ch(x.b, y.b));
  }

  function over(fg, bg) {
    return blend(bg, fg, channels(fg).a / 255);
  }

  function luminance(c) {
    const { r, g, b } = channels(c);
    const lin = (v) => {
      const s = v / 255;
      return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  }

  function contrast(fg, bg) {
    const la = luminance(over(fg, bg));
    const lb = luminance(bg);
    return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
  }

  const BLACK = argb(255, 0, 0, 0);
  const WHITE = -1;

  /**
   * The simple view's five colours (bg, key, text, fn, accent) as the 24 a theme has, after the
   * dynamic-colour theme's rule (Theme.Monet): bg the board, the bar and the popups; key the letters
   * and the space; text the keys', the candidates' and the popups'; fn the function keys; accent
   * Return and what is chosen. The rest: comments and the function keys' text at 75 % of the text,
   * the press 12 % of it (20 % dark), the divider 12 %, the shadow and border black at 20 % (40 % dark),
   * Return's text white unless it is under 3:1 on the accent (as the built-in themes have it), then black.
   */
  function deriveSimple(s, isDark) {
    const accentText = contrast(WHITE, s.accent) >= 3 ? WHITE : BLACK;
    const soft = withAlpha(s.text, 0.75);
    const shadow = withAlpha(BLACK, isDark ? 0.4 : 0.2);
    return {
      backgroundColor: s.bg,
      barColor: s.bg,
      keyboardColor: s.bg,
      keyBackgroundColor: s.key,
      keyTextColor: s.text,
      candidateTextColor: s.text,
      candidateLabelColor: s.text,
      candidateCommentColor: soft,
      altKeyBackgroundColor: s.fn,
      altKeyTextColor: soft,
      accentKeyBackgroundColor: s.accent,
      accentKeyTextColor: accentText,
      keyPressHighlightColor: withAlpha(s.text, isDark ? 0.2 : 0.12),
      keyShadowColor: shadow,
      popupBackgroundColor: s.bg,
      popupTextColor: s.text,
      spaceBarColor: s.key,
      dividerColor: withAlpha(s.text, 0.12),
      clipboardEntryColor: s.key,
      genericActiveBackgroundColor: s.accent,
      genericActiveForegroundColor: accentText,
      keyBorderColor: shadow,
      keyHintColor: soft,
      toolbarIconColor: soft,
    };
  }

  /** The five a palette is read back as in the simple view. */
  function simpleOf(p) {
    return { bg: p.backgroundColor, key: p.keyBackgroundColor, text: p.keyTextColor, fn: p.altKeyBackgroundColor, accent: p.accentKeyBackgroundColor };
  }

  /** Whether a colour reads as dark (the theme's isDark guessed from its background). */
  function isDarkColor(c) {
    return luminance(c) < 0.18;
  }

  /** [c] with its lightness turned over (HSL, alpha and hue kept): a palette's dark copy. */
  function invertLightness(c) {
    const { a, r, g, b } = channels(c);
    const R = r / 255, G = g / 255, B = b / 255;
    const max = Math.max(R, G, B), min = Math.min(R, G, B);
    let h = 0, s = 0;
    const l = (max + min) / 2;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      h = max === R ? (G - B) / d + (G < B ? 6 : 0) : max === G ? (B - R) / d + 2 : (R - G) / d + 4;
      h /= 6;
    }

    const v = S.view;
    const tries = [
      { phone: v.phone, land: v.land, board: v.board, mode: v.mode, state: v.state },
      { phone: v.phone, land: v.land, board: v.board, mode: v.mode, state: 'idle' },
      { phone: v.phone, land: v.land, board: v.board, mode: 'normal', state: 'idle' },
      { phone: v.phone, land: v.land, board: 'qwerty', mode: 'normal', state: 'idle' },
      { phone: v.phone, land: v.land },
    ];
    for (const t of tries) {
      const got = views(t);
      if (got.length) return got[0];
    }
    return LAYOUT.views[0];
  }
  function cutFor(land) {
    const p = S.theme.picture;
    if (!p) return null;
    const c = land && p.landscape ? p.landscape : p.portrait;
    return S.sizes[c.file] ? c.file : null;
  }
  const kindField = (kind) => L.faceField(kind, S.theme.keys.blocks);
  const kindColor = (kind) => S.theme.palette[kindField(kind)];
  /** An item's colour: its palette field (or "#AARRGGBB"), times its alpha a. */
  function colorOf(e) {
    let argb = e.c && e.c[0] === '#' ? parseInt(e.c.slice(1), 16) >>> 0 : S.theme.palette[e.c];
    if (argb == null) argb = 0xff000000;
    if (e.a != null) argb = ((Math.round((argb >>> 24) * e.a) << 24) | (argb & 0xffffff)) >>> 0;
    return L.css(argb);
  }
  /**
   * A text or a key's label at its baseline y. With al (l | c | r) and x, the line's left end, middle or
   * right end is at x; without, the view is the text's width and it is centred in r. [scale] (a key's
   * text size) grows it about its middle, or, a corner label ([corner]: the key's cell), about the
   * corner it keeps to.
   */
  const alignOf = (e) => e.al;
  function drawText(e, font, weight, scale, family, corner) {
    const [l, t, r, b] = e.cell || boxOf(e.r);
    let fx = (l + r) / 2;
    let fy = (t + b) / 2;
    if (corner) {
      fx = (l + r) / 2 > (corner[0] + corner[2]) / 2 ? r : l;
      fy = (t + b) / 2 > (corner[1] + corner[3]) / 2 ? b : t;
    }
    const al = alignOf(e);
    const anchor = { l: 'start', c: 'middle', r: 'end' }[al] || 'middle';
    const x0 = al ? e.x : (l + r) / 2;
    return s('text', {
      x: fx + (x0 - fx) * scale, y: fy + (e.y - fy) * scale, 'text-anchor': anchor, 'font-size': e.z * scale,
      'font-family': family(font), 'font-weight': weight, fill: colorOf(e),
    }, e.s);
  }
  /** An icon in its box: the vector at its own size (24 dp for 24 units), smaller only if the box is. */
  function drawIcon(e) {
    const ic = ICONS[e.i];
    if (!ic) return s('g');
    const [l, t, r, b] = e.cell || boxOf(e.r);
    const k = Math.min(1, (r - l) / ic.vw, (b - t) / ic.vh);
    const fill = colorOf(e);
    // rot: the view turned about its middle (the bar's menu arrow is expand_more at -90°)
    const turn = e.rot ? `rotate(${e.rot} ${(l + r) / 2} ${(t + b) / 2}) ` : '';
    return s('g', { transform: `${turn}translate(${(l + r) / 2 - (ic.vw * k) / 2},${(t + b) / 2 - (ic.vh * k) / 2}) scale(${k})` },
      ic.paths.map((p) => s('path', {
        d: p.d, transform: p.transform, 'fill-rule': p.rule === 'evenodd' ? 'evenodd' : undefined,
        fill: p.stroke ? 'none' : fill, stroke: p.stroke ? fill : undefined, 'stroke-width': p.stroke, opacity: p.alpha,
      })));
  }

  // ---- the preview ----
  const preview = { svg: null, box: null, note: null };
  let ids = 0;
  function renderPreview() {
    const v = currentView();
    const d = density();
    const T = S.theme;
    const P = T.palette;
    const land = v.land;
    // the screen's width, the keyboard where the app puts it across it; above it what floats over it (preedit, a popup)
    const W = v.screen[0];
    const X = -v.keyboard[0];
    let top = 0;
    let maxY = v.keyboard[3];
    for (const e of v.els) { top = Math.min(top, e.cell[1]); maxY = Math.max(maxY, e.cell[3]); }
    const narrow = window.matchMedia('(max-width: 600px)').matches;
    const appH = narrow ? 50 : 110; // on a phone only the text field: the keyboard has the room
    const dark = S.view.sys === 'dark';
    const defs = s('defs');
    const Y = top - appH;
    const H = maxY - Y;
    const svg = s('svg', { viewBox: `${X} ${Y} ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': '键盘预览' }, defs);
    ids = 0;
    const clip = (shape) => {
      const id = 'c' + ++ids;
      defs.append(s('clipPath', { id }, shape));
      return `url(#${id})`;
    };
    // the app behind: the page's light or dark, to see translucent keys against
    svg.append(s('rect', { x: X, y: Y, width: W, height: H, fill: dark ? '#202124' : '#f1f3f4' }));
    if (!narrow) for (let i = 0; i < 4; i++) svg.append(s('rect', { x: X + 16, y: Y + 14 + i * 16, width: W * (0.75 - i * 0.12), height: 8, rx: 4, fill: dark ? '#3c4043' : '#dadce0' }));
    svg.append(s('rect', { x: X + 10, y: top - 40, width: W - 20, height: 32, rx: 16, fill: dark ? '#303134' : '#ffffff', stroke: dark ? '#5f6368' : '#c4c7c5' }));
    svg.append(s('text', { x: X + 26, y: top - 24, 'dominant-baseline': 'central', 'font-size': 13, fill: dark ? '#9aa0a6' : '#80868b' }, '说点什么…'));

    const fr = v.frame;
    const frW = fr[2] - fr[0];
    const frH = fr[3] - fr[1];
    const board = s('g', { 'clip-path': clip(s('rect', { x: fr[0], y: fr[1], width: frW, height: frH })) });
    svg.append(board);
    // the picture over the whole keyboard (bar and keys), centre cropped as PictureWindow does
    const cut = cutFor(land);
    const window_ = cut ? (() => {
      const [pw, ph] = S.sizes[cut];
      const c = L.centerCrop(pw, ph, frW * d, frH * d);
      return { x: fr[0] + c.dx / d, y: fr[1] + c.dy / d, w: (pw * c.scale) / d, h: (ph * c.scale) / d };
    })() : null;
    const pictureIn = (g, blurDp, brightness, clipPath) => {
      if (!window_) return;
      const href = blurDp > 0 ? blurredPicture(cut, blurDp, d) : S.urls[cut];
      const grp = s('g', { 'clip-path': clipPath });
      grp.append(s('image', { href, x: window_.x, y: window_.y, width: window_.w, height: window_.h, preserveAspectRatio: 'none' }));
      const a = L.darkenAlpha(brightness);
      if (a > 0) grp.append(s('rect', { x: window_.x, y: window_.y, width: window_.w, height: window_.h, fill: `rgba(0,0,0,${a / 255})` }));
      g.append(grp);
    };
    const baseColor = P[L.boardField(T.keys)];
    if (T.base.type === 'picture' && window_) pictureIn(board, T.picture.blurDp, T.picture.brightness, null);
    else board.append(s('rect', { x: fr[0], y: fr[1], width: frW, height: frH, fill: L.css(baseColor) }));
    const barItem = v.els.find((e) => e.t === 'bar');
    const bar = barItem && barItem.cell;
    if (bar && L.barField(T.bar)) board.append(s('rect', { x: bar[0], y: bar[1], width: bar[2] - bar[0], height: bar[3] - bar[1], fill: L.css(P[L.barField(T.bar)]) }));
    if (bar && T.bar.type === 'picture') pictureIn(board, T.bar.blurDp, T.bar.brightness, clip(s('rect', { x: bar[0], y: bar[1], width: bar[2] - bar[0], height: bar[3] - bar[1] })));

    const keyFont = T.text.keyFont && S.fonts[T.text.keyFont];
    const candFont = T.text.candidateFont && S.fonts[T.text.candidateFont];
    const family = (f) => (f ? `'${f}', ` : '') + 'system-ui, sans-serif';
    v.els.forEach((e, i) => {
      if (e.t === 'key') svg.append(drawKey(e, i, v, d, clip, pictureIn, keyFont, family));
      else if (e.t === 'icon') svg.append(drawIcon(e));
      else if (e.t === 'fill') {
        const [l, t, r, b] = e.cell;
        svg.append(s('rect', { x: l, y: t, width: r - l, height: b - t, rx: e.rad || 0, fill: colorOf(e) }));
      } else if (e.t === 'text') {
        // candidates and the preedit in the candidate font, unscaled; the rest is the keyboard's
        const cand = e.p === 'preedit' || (e.p === 'bar' && e.c === 'candidateTextColor');
        const el = drawText(e, cand ? candFont : keyFont, e.w || (cand ? T.text.candidateWeight : T.text.keyWeight), 1, family);
        // a line in a wider view over the keys (a clipboard entry) is cut at the view's edge; a title in
        // the bar is not, its view as wide as the line was in the app's font
        if (alignOf(e) && e.p === 'keyboard') el.setAttribute('clip-path', clip(s('rect', { x: e.r[0], y: e.r[1], width: e.r[2], height: e.r[3] })));
        svg.append(el);
      }
    });
    if (S.box) svg.append(s('rect', { x: Math.min(S.box[0], S.box[2]), y: Math.min(S.box[1], S.box[3]), width: Math.abs(S.box[2] - S.box[0]),
      height: Math.abs(S.box[3] - S.box[1]), fill: 'rgba(255,138,0,.15)', stroke: '#ff8a00', 'stroke-dasharray': '4 3' }));
    // the size: 1 dp a CSS pixel, unless the column is narrower (a phone, a landscape board)
    const room = preview.stage.clientWidth || W;
    if (W > room) {
      svg.setAttribute('width', room);
      svg.setAttribute('height', (H * room) / W);
    }
    preview.stage.replaceChildren(svg);
    preview.svg = svg;
    preview.view = v;
    preview.note.textContent = (W > room ? '已缩小显示 · ' : '实际尺寸 · ') +
      (S.tab === 'keys' && S.keyTab === 'single' ? '点键选中，Shift+点多选，拖框框选（手机上长按进入多选）' : '按住预览里的键看按下的样子');
  }

  function drawKey(e, i, v, d, clip, pictureIn, keyFont, family) {
    const T = S.theme;
    const P = T.palette;
    const [l, t, r, b] = e.cell;
    const parsed = e.name ? L.parseKeyName(e.name) : null;
    const style = L.resolveStyle(T.keys, parsed && parsed.board, parsed && parsed.key, e.kind, ROLES);
    const g0 = L.keyFace((r - l) * d, (b - t) * d, e.kind, T.keys, v.land, d, e.m !== false, e.b || 'default');
    const dp = (a) => a && [l + a[0] / d, t + a[1] / d, l + a[2] / d, t + a[3] / d];
    const face = dp(g0.face);
    const pressedArea = dp(g0.pressed);
    const radius = g0.radius / d;
    const shape = (a) => g0.oval
      ? s('ellipse', { cx: (a[0] + a[2]) / 2, cy: (a[1] + a[3]) / 2, rx: (a[2] - a[0]) / 2, ry: (a[3] - a[1]) / 2 })
      : s('rect', { x: a[0], y: a[1], width: Math.max(0, a[2] - a[0]), height: Math.max(0, a[3] - a[1]), rx: radius });
    const paint = (a, fill) => { const sh = shape(a); sh.setAttribute('fill', fill); return sh; };
    const g = s('g', { 'data-i': i, class: 'key' });
    const isPressed = S.pressed === i;
    const area = face || pressedArea;
    if (g0.shadow) g.append(paint(dp(g0.shadow), L.css(P.keyShadowColor)));
    const drawFill = (fill, a) => {
      if (fill.type === 'color') {
        if (face) g.append(paint(a, L.css(kindColor(e.kind))));
      } else if (fill.type === 'image') {
        g.append(nine(fill, a, d, clip(shape(a))));
      } else if (fill.type === 'picture') {
        pictureIn(g, fill.blurDp, fill.brightness, clip(shape(a)));
        // and the kind's colour over it, as KeyFaceDrawable lays it: a translucent one makes the glass
        g.append(paint(a, L.css(kindColor(e.kind))));
      }
    };
    if (isPressed && style.pressed.type === 'color') g.append(paint(pressedArea, L.css(style.pressed.argb)));
    else if (isPressed && style.pressed.type === 'image') g.append(nine(style.pressed, pressedArea, d, clip(shape(pressedArea))));
    else drawFill(style.fill, area);
    if (isPressed && style.pressed.type === 'darken') {
      if (T.keys.press === 'ripple') {
        const cx = (pressedArea[0] + pressedArea[2]) / 2;
        const cy = (pressedArea[1] + pressedArea[3]) / 2;
        const rr = Math.hypot(pressedArea[2] - pressedArea[0], pressedArea[3] - pressedArea[1]) / 3;
        g.append(s('circle', { cx, cy, r: rr, fill: L.css(P.keyPressHighlightColor), 'clip-path': clip(shape(pressedArea)) }));
      } else g.append(paint(pressedArea, L.css(P.keyPressHighlightColor)));
    }
    if (face && g0.border > 0) {
      const bw = g0.border / d;
      const inset = [face[0] + bw / 2, face[1] + bw / 2, face[2] - bw / 2, face[3] - bw / 2];
      const sh = shape(inset);
      sh.setAttribute('fill', 'none');
      sh.setAttribute('stroke', L.css(P.keyBorderColor));
      sh.setAttribute('stroke-width', bw);
      g.append(sh);
    }
    if (style.label !== 'hide') {
      for (const x of e.l || []) g.append(drawText(x, keyFont, x.w || T.text.keyWeight, T.text.keyScale / 100, family, x.role === 'main' ? null : e.cell));
      for (const x of e.i || []) g.append(drawIcon(x));
    }
    if (S.tab === 'keys' && S.keyTab === 'single' && e.name && S.selected.includes(e.name)) {
      g.append(s('rect', { x: l + 1, y: t + 1, width: r - l - 2, height: b - t - 2, rx: 4, fill: 'none', stroke: '#ff8a00', 'stroke-width': 2 }));
    }
    // the whole cell takes the pointer, as the app's key does
    g.append(s('rect', { x: l, y: t, width: r - l, height: b - t, fill: 'transparent' }));
    return g;
  }

  /** An image key face: NineSliceLayout's pieces, each a nested svg showing its part of the image. */
  function nine(fill, a, d, clipPath) {
    const g = s('g', { 'clip-path': clipPath });
    const size = S.sizes[fill.file];
    if (!size) return g;
    const target = [a[0] * d, a[1] * d, a[2] * d, a[3] * d];
    for (const p of L.nineSlice(size[0], size[1], fill.insets, fill.pxPerDp, target, d)) {
      const [sl, st, sr, sb] = p.src;
      const [dl, dt, dr, db] = p.dst;
      if (sr <= sl || sb <= st || dr <= dl || db <= dt) continue;
      g.append(s('svg', { x: dl / d, y: dt / d, width: (dr - dl) / d, height: (db - dt) / d, viewBox: `${sl} ${st} ${sr - sl} ${sb - st}`, preserveAspectRatio: 'none' },
        s('image', { href: S.urls[fill.file], x: 0, y: 0, width: size[0], height: size[1] })));
    }
    return g;
  }

  // the preview's pointer: hold to press; on the single-key tab, click, Shift+click and a box select
  function svgPoint(ev) {
    const pt = preview.svg.createSVGPoint();
    pt.x = ev.clientX;
    pt.y = ev.clientY;
    return pt.matrixTransform(preview.svg.getScreenCTM().inverse());
  }
  function bindPreview(stage) {
    let start = null;
    let longTimer = 0;
    const selecting = () => S.tab === 'keys' && S.keyTab === 'single';
    stage.addEventListener('pointerdown', (ev) => {
      if (!preview.svg) return;
      const k = ev.target.closest && ev.target.closest('[data-i]');
      const p = svgPoint(ev);
      start = { x: p.x, y: p.y, i: k ? +k.dataset.i : -1, moved: false, shift: ev.shiftKey, touch: ev.pointerType === 'touch' };
      stage.setPointerCapture(ev.pointerId);
      if (k) {
        S.pressed = +k.dataset.i;
        renderPreview();
        if (start.touch && selecting()) {
          longTimer = setTimeout(() => {
            S.multi = true;
            toggle(preview.view.els[start.i].name, true);
            start.i = -2;
            if (navigator.vibrate) navigator.vibrate(20);
          }, 500);
        }
      }
    });
    stage.addEventListener('pointermove', (ev) => {
      if (!start || !selecting()) return;
      const p = svgPoint(ev);
      if (Math.hypot(p.x - start.x, p.y - start.y) > 6) start.moved = true;
      if (start.moved && !start.touch) {
        clearTimeout(longTimer);
        S.pressed = -1;
        S.box = [start.x, start.y, p.x, p.y];
        renderPreview();
      }
    });
    const end = () => {
      clearTimeout(longTimer);
      if (!start) return;
      const st = start;
      start = null;
      if (S.box) {
        const [x0, x1] = [Math.min(S.box[0], S.box[2]), Math.max(S.box[0], S.box[2])];
        const [y0, y1] = [Math.min(S.box[1], S.box[3]), Math.max(S.box[1], S.box[3])];
        const names = preview.view.els.filter((e) => e.t === 'key' && e.name && e.cell[0] < x1 && e.cell[2] > x0 && e.cell[1] < y1 && e.cell[3] > y0).map((e) => e.name);
        S.box = null;
        S.selected = st.shift ? [...new Set([...S.selected, ...names])] : [...new Set(names)];
        S.pressed = -1;
        renderPreview();
        renderSettings();
        return;
      }
      S.pressed = -1;
      if (selecting() && st.i >= 0 && !st.moved) {
        const e = preview.view.els[st.i];
        if (e.name) toggle(e.name, st.shift || S.multi);
        else toast('这个键没有名字（比如符号面板的格子），只能按它那一类设置');
      } else if (selecting() && st.i === -1 && !st.moved && !S.multi) {
        S.selected = [];
        renderSettings();
      }
      renderPreview();
    };
    stage.addEventListener('pointerup', end);
    stage.addEventListener('pointercancel', end);
  }
  function toggle(name, add) {
    if (!add) S.selected = [name];
    else if (S.selected.includes(name)) S.selected = S.selected.filter((n) => n !== name);
    else S.selected = [...S.selected, name];
    renderPreview();
    renderSettings();
  }

  // ---- the controls over the preview ----
  function renderControls(box) {
    const v = S.view;
    const has = (m) => views({ phone: v.phone, land: v.land, ...m }).length > 0;
    const boards = [...new Set(LAYOUT.views.filter((x) => x.phone === v.phone && x.land === v.land).map((x) => x.board))];
    const set = (k, x) => {
      S.view[k] = x;
      if (k === 'sys') document.documentElement.dataset.theme = x;
      S.selected = [];
      save();
      renderControls(box);
      renderPreview();
      if (S.tab === 'keys') renderSettings();
    };
    box.replaceChildren(
      h('label', { class: 'k', for: 'phone' }, '手机'),
      h('div', {}, h('select', { id: 'phone', onchange: (e) => set('phone', e.target.value) },
        LAYOUT.phones.map((p) => h('option', { value: p.id, selected: p.id === v.phone }, `${p.w}×${p.h} · ${p.dpi}`))), ' ',
      seg([[false, '竖屏'], [true, '横屏']], v.land, (x) => set('land', x))),
      h('label', { class: 'k' }, '键盘'),
      seg(boards.map((b) => [b, BOARD_LABEL[b] || b]), currentView().board, (x) => set('board', x)),
      h('label', { class: 'k' }, '模式'),
      seg(Object.entries(MODE_LABEL), currentView().mode, (x) => set('mode', x), (x) => !has({ board: currentView().board, mode: x })),
      h('label', { class: 'k' }, '状态'),
      seg(Object.entries(STATE_LABEL), currentView().state, (x) => set('state', x), (x) => !has({ board: currentView().board, mode: currentView().mode, state: x })),
      h('label', { class: 'k' }, '系统'),
      seg([['light', '浅色'], ['dark', '深色']], v.sys, (x) => set('sys', x)),
    );
    const cv = currentView();
    summaryBox.textContent = '预览 · ' + [phone().w + '×' + phone().h, v.land ? '横屏' : '竖屏', BOARD_LABEL[cv.board] || cv.board, MODE_LABEL[cv.mode], STATE_LABEL[cv.state]].join(' · ');
    if (v.land && currentView().board === 'qwerty' && currentView().mode === 'normal') {
      box.append(h('span'), h('div', { class: 'hint' }, '横屏的 26 键按 App 默认分成左右两半（分体）'));
    }
  }

  // ---- the settings ----
  const TABS = [['picture', '主题图'], ['colors', '颜色'], ['keys', '按键'], ['text', '文字'], ['bar', '候选栏'], ['popup', '弹窗']];
  let settingsBox = null;
  let tabsBox = null;
  function renderSettings() {
    tabsBox.replaceChildren(...TABS.map(([id, label]) => h('button', { type: 'button', role: 'tab', 'aria-selected': String(S.tab === id),
      onclick: () => { S.tab = id; save(); renderSettings(); renderPreview(); } }, label)));
    const body = { picture: pictureTab, colors: colorsTab, keys: keysTab, text: textTab, bar: barTab, popup: popupTab }[S.tab]();
    settingsBox.replaceChildren(...[body].flat().filter(Boolean));
  }

  function colorRow(field, note) {
    const P = S.theme.palette;
    const c = P[field];
    const { a } = L.channels(c);
    const text = h('input', { type: 'text', value: L.toHex(c), 'aria-label': COLOR_LABEL[field] + ' #AARRGGBB', spellcheck: false });
    const pick = h('input', { type: 'color', value: '#' + L.toHex(c).slice(3).toLowerCase(), 'aria-label': COLOR_LABEL[field] });
    const alpha = h('input', { type: 'range', min: 0, max: 255, value: a, 'aria-label': COLOR_LABEL[field] + ' 透明度', title: '透明度' });
    const apply = (col) => {
      setPalette(field, col);
      text.value = L.toHex(col);
      pick.value = '#' + L.toHex(col).slice(3).toLowerCase();
      alpha.value = L.channels(col).a;
      changed();
      warnBox.replaceChildren(...contrastWarnings(field));
      followBox.replaceChildren(...follow(field));
    };
    text.addEventListener('change', () => {
      const col = L.fromHex(text.value);
      if (col == null) { text.value = L.toHex(S.theme.palette[field]); toast('颜色写成 #AARRGGBB 或 #RRGGBB'); return; }
      apply(col);
    });
    pick.addEventListener('input', () => apply((L.fromHex(pick.value) & 0xffffff) | (alpha.value << 24)));
    alpha.addEventListener('input', () => apply((S.theme.palette[field] & 0xffffff) | (alpha.value << 24)));
    const warnBox = h('div', {}, contrastWarnings(field));

  function follow(field) {

  async function choosePicture() {
    const [file] = await pickFile('image/*');
    if (!file) return;
    if (file.size > LIM.fileBytes) return toast('图片太大（超过 32 MB）', true);
    const bytes = await readBytes(file);
    let bm;
    try {
      bm = await createImageBitmap(new Blob([bytes]));
    } catch (e) {
      return toast('浏览器打不开这张图' + (/heic|heif/i.test(file.name) ? '：这个格式浏览器打不开，先转成 jpg' : ''), true);
    }
    const T = S.theme;
    const src = await addFile('src', L.imageType(bytes) ? bytes : await pngOf(drawn(bm)));
    if (!T.picture) {
      // as the app's new theme from a picture: the translucent keys, dark or light by the picture
      const dark = L.luminance(averageOf(bm)) < 0.4;
      const preset = PRESETS.find((x) => x.name === (dark ? 'TransparentDark' : 'TransparentLight'));
      if (preset) {
        T.palette = clone(preset.palette);
        T.isDark = preset.isDark;
        S.manual = [];
      }
      T.base = { type: 'picture' };
    }
    T.picture = { src, portrait: { file: src, cropRect: null, rotation: 0 }, landscape: null, brightness: T.picture ? T.picture.brightness : 70, blurDp: T.picture ? T.picture.blurDp : 0 };
    await cutPicture(false, null, 0); // centred at first: the dialog moves it
    cropDialog(false);
  }
  function drawn(bm) {
    const c = canvasOf(bm.width, bm.height);
    c.getContext('2d').drawImage(bm, 0, 0);
    return c;
  }
  function removePicture() {
    const T = S.theme;
    T.picture = null;
    T.base = { type: 'color' };
    if (T.bar.type === 'picture') T.bar = { type: 'transparent' };
    for (const k of KINDS) if (T.keys[k].fill.type === 'picture') T.keys[k].fill = { type: 'color' };
    for (const o of Object.values(T.keys.overrides)) if (o.fill && o.fill.type === 'picture') o.fill = null;
    changed({ settings: true });
  }
  /** The keyboard's whole area on this phone, portrait or landscape, in px: what a cut is shaped to. */
  function boardPx(land) {
    const v = views({ phone: S.view.phone, land, board: 'qwerty', mode: 'normal', state: 'idle' })[0] || currentView();
    const d = density();
    return [Math.round((v.frame[2] - v.frame[0]) * d), Math.round((v.frame[3] - v.frame[1]) * d)];
  }
  /** Cuts [box] (on the picture turned [rotation], null: centred) to a PNG the keyboard's size at most; the crop kept as the source's box. */
  async function cutPicture(land, box, rotation) {
    const T = S.theme;
    const bm = S.bitmaps[T.picture.src];
    const [sw, sh] = [bm.width, bm.height];
    const turned = rotation % 180 ? [sh, sw] : [sw, sh];
    const [bw, bh] = boardPx(land);
    if (!box) {
      const k = Math.min(turned[0] / bw, turned[1] / bh);
      const w = bw * k, hh = bh * k;
      box = [Math.round((turned[0] - w) / 2), Math.round((turned[1] - hh) / 2), Math.round((turned[0] + w) / 2), Math.round((turned[1] + hh) / 2)];
    }
    const [ow, oh] = L.resizeInside(box[2] - box[0], box[3] - box[1], bw, bh);
    const c = canvasOf(ow, oh);
    const g = c.getContext('2d');
    g.imageSmoothingQuality = 'high';
    g.scale(ow / (box[2] - box[0]), oh / (box[3] - box[1]));
    g.translate(-box[0], -box[1]);
    // the source turned clockwise [rotation] into the turned picture's space
    g.translate(turned[0] / 2, turned[1] / 2);
    g.rotate((rotation * Math.PI) / 180);
    g.drawImage(bm, -sw / 2, -sh / 2);
    const file = await addFile(land ? 'landscape' : 'portrait', await pngOf(c));
    const src = L.cropToSource(box, sw, sh, rotation);
    const crop = { file, cropRect: { bottom: src[3], left: src[0], right: src[2], top: src[1] }, rotation };
    if (land) T.picture.landscape = crop;
    else T.picture.portrait = crop;
    S.avg[file] = averageOf(S.bitmaps[file]);
    changed({ settings: true });
  }
  function cropDialog(land) {
    const T = S.theme;
    const bm = S.bitmaps[T.picture.src];
    if (!bm) return toast('原图不在这里：重新选一张图', true);
    const cur = land ? T.picture.landscape : T.picture.portrait;
    let rotation = cur ? cur.rotation : 0;
    const [bw, bh] = boardPx(land);
    const aspect = bw / bh;
    let box = null;
    const turnedSize = () => (rotation % 180 ? [bm.height, bm.width] : [bm.width, bm.height]);
    const fit = () => {
      const [tw, th] = turnedSize();
      const k = Math.min(tw / bw, th / bh);
      box = [(tw - bw * k) / 2, (th - bh * k) / 2, (tw + bw * k) / 2, (th + bh * k) / 2];
    };
    if (cur && cur.cropRect && cur.cropRect.left >= 0 && cur.file !== T.picture.src) {
      const r = cur.cropRect;
      box = L.cropFromSource([r.left, r.top, r.right, r.bottom], bm.width, bm.height, rotation);
    } else fit();
    const area = h('div', { class: 'crop-area' });
    const canvas = canvasOf(1, 1);
    const frame = h('div', { class: 'crop-frame' }, h('div', { class: 'h' }));
    area.append(canvas, frame);
    let scale = 1;
    const draw = () => {
      const [tw, th] = turnedSize();
      const maxW = Math.min(window.innerWidth * 0.86, 860);
      const maxH = window.innerHeight * 0.6;
      scale = Math.min(maxW / tw, maxH / th);
      canvas.width = Math.round(tw * scale);
      canvas.height = Math.round(th * scale);
      area.style.width = canvas.width + 'px';
      area.style.height = canvas.height + 'px';
      const g = canvas.getContext('2d');
      g.save();
      g.translate(canvas.width / 2, canvas.height / 2);
      g.rotate((rotation * Math.PI) / 180);
      g.drawImage(bm, (-bm.width * scale) / 2, (-bm.height * scale) / 2, bm.width * scale, bm.height * scale);
      g.restore();
      place();
    };
    const place = () => {
      Object.assign(frame.style, { left: box[0] * scale + 'px', top: box[1] * scale + 'px', width: (box[2] - box[0]) * scale + 'px', height: (box[3] - box[1]) * scale + 'px' });
    };
    const clamp = () => {
      const [tw, th] = turnedSize();
      let w = box[2] - box[0];
      let hh = w / aspect;
      if (w > tw) { w = tw; hh = w / aspect; }
      if (hh > th) { hh = th; w = hh * aspect; }
      w = Math.max(w, 16); hh = w / aspect;
      const x = Math.min(Math.max(0, box[0]), tw - w);
      const y = Math.min(Math.max(0, box[1]), th - hh);
      box = [x, y, x + w, y + hh];
    };
    let drag = null;
    frame.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      frame.setPointerCapture(ev.pointerId);
      drag = { x: ev.clientX, y: ev.clientY, box: box.slice(), resize: ev.target.classList.contains('h') };
    });
    frame.addEventListener('pointermove', (ev) => {
      if (!drag) return;
      const dx = (ev.clientX - drag.x) / scale;
      const dy = (ev.clientY - drag.y) / scale;
      if (drag.resize) {
        const w = Math.max(16, drag.box[2] - drag.box[0] + Math.max(dx, dy * aspect));
        box = [drag.box[0], drag.box[1], drag.box[0] + w, drag.box[1] + w / aspect];
      } else box = [drag.box[0] + dx, drag.box[1] + dy, drag.box[2] + dx, drag.box[3] + dy];
      clamp();
      place();
    });
    frame.addEventListener('pointerup', () => (drag = null));
    area.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const k = ev.deltaY > 0 ? 1.06 : 1 / 1.06;
      const cx = (box[0] + box[2]) / 2, cy = (box[1] + box[3]) / 2;
      const w = (box[2] - box[0]) * k, hh = w / aspect;
      box = [cx - w / 2, cy - hh / 2, cx + w / 2, cy + hh / 2];
      clamp();
      place();
    }, { passive: false });
    const dlg = h('dialog', { 'aria-label': land ? '横屏裁剪' : '竖屏裁剪' },
      h('h3', {}, (land ? '横屏' : '竖屏') + '裁剪 · 框的比例是这台手机整个键盘区的宽高'),
      h('div', { class: 'row' },
        h('button', { type: 'button', onclick: () => { rotation = (rotation + 90) % 360; fit(); draw(); } }, '转 90°'),
        h('button', { type: 'button', onclick: () => { fit(); place(); } }, '放到最大'),
        h('span', { class: 'hint' }, '拖动框移动，拖右下角圆点或滚轮缩放')),
      area,
      h('div', { class: 'row' },
        h('button', { type: 'button', class: 'primary', onclick: async () => {
          dlg.close();
          await cutPicture(land, box.map(Math.round), rotation);
        } }, '用这一块'),
        h('button', { type: 'button', onclick: () => { dlg.close(); if (land && !T.picture.landscape) renderSettings(); } }, '取消')));
    dlg.addEventListener('close', () => dlg.remove());
    document.body.append(dlg);
    dlg.showModal();
    clamp();
    draw();
  }

    const [file] = await pickFile('image/png,image/jpeg,image/webp');
    if (!file) return null;
    if (file.size > LIM.fileBytes) { toast('图片太大（超过 32 MB）', true); return null; }
    let bytes = await readBytes(file);
    let bm;
    try { bm = await createImageBitmap(new Blob([bytes])); } catch (e) { toast('浏览器打不开这张图', true); return null; }
    let shrunk = false;
    let side = Math.max(bm.width, bm.height);
    let k = Math.min(1, LIM.keyImageSide / side);
    for (let tries = 0; (k < 1 || bytes.length > LIM.keyImageBytes || !L.imageType(bytes)) && tries < 6; tries++) {
      const c = canvasOf(Math.max(1, Math.round(bm.width * k)), Math.max(1, Math.round(bm.height * k)));
      c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height);
      bytes = await pngOf(c);
      shrunk = shrunk || k < 1;
      k *= 0.75;
    }
    if (shrunk) toast('图片超过 App 的上限（边长 1024、2 MB），已缩小');
    const name = await addFile('key', bytes);
    const [w, hh] = S.sizes[name] || [bm.width, bm.height];
    return { type: 'image', file: name, insets: [0, 0, 0, 0], pxPerDp: Math.min(LIM.pxPerDp, Math.max(1, Math.round(Math.max(w, hh) / 48))) };
  }
  /** The nine-slice editor: four lines on the image to drag (what is not stretched), and a wide and a narrow key drawn with it. */
  function imageEditor(img, set) {
    const size = S.sizes[img.file];
    const box = h('div', {});
    if (!size) {
      box.append(h('div', { class: 'warn' }, '这张图不在这里（从浏览器存的进度恢复时不带图片）：重新选一张。'));
      return box;
    }
    const [w, hh] = size;
    const k = Math.min(160 / w, 160 / hh, 4);
    const ed = s('svg', { width: w * k, height: hh * k, viewBox: `0 0 ${w} ${hh}` });
    ed.append(s('image', { href: S.urls[img.file], x: 0, y: 0, width: w, height: hh }));
    const lines = [];
    const draw = () => {
      lines.forEach((l) => l.remove());
      lines.length = 0;
      const [il, it, ir, ib] = img.insets;
      const add = (x1, y1, x2, y2, side) => {
        const ln = s('line', { x1, y1, x2, y2, stroke: '#ff8a00', 'stroke-width': Math.max(1, 2 / k), 'stroke-dasharray': `${4 / k} ${3 / k}`, 'data-side': side, style: `cursor:${side % 2 ? 'ns' : 'ew'}-resize` });
        const hit = s('line', { x1, y1, x2, y2, stroke: 'transparent', 'stroke-width': 14 / k, 'data-side': side, style: `cursor:${side % 2 ? 'ns' : 'ew'}-resize` });
        lines.push(ln, hit);
        ed.append(ln, hit);
      };
      add(il, 0, il, hh, 0);
      add(0, it, w, it, 1);
      add(w - ir, 0, w - ir, hh, 2);
      add(0, hh - ib, w, hh - ib, 3);
      demo.replaceChildren(...demoKeys(img));
      nums.forEach((n, i) => (n.value = img.insets[i]));
    };
    let drag = -1;
    ed.addEventListener('pointerdown', (ev) => { const sd = ev.target.dataset && ev.target.dataset.side; if (sd != null) { drag = +sd; ed.setPointerCapture(ev.pointerId); } });
    ed.addEventListener('pointermove', (ev) => {
      if (drag < 0) return;
      const r = ed.getBoundingClientRect();
      const x = Math.round((ev.clientX - r.left) / k);
      const y = Math.round((ev.clientY - r.top) / k);
      const ins = img.insets.slice();
      if (drag === 0) ins[0] = Math.max(0, Math.min(x, w - ins[2]));
      if (drag === 1) ins[1] = Math.max(0, Math.min(y, hh - ins[3]));
      if (drag === 2) ins[2] = Math.max(0, Math.min(w - x, w - ins[0]));
      if (drag === 3) ins[3] = Math.max(0, Math.min(hh - y, hh - ins[1]));
      img.insets = ins;
      draw();
      renderPreview();
    });
    ed.addEventListener('pointerup', () => { if (drag >= 0) { drag = -1; save(); } });
    const nums = ['左', '上', '右', '下'].map((label, i) => h('input', { type: 'number', min: 0, max: i % 2 ? hh : w, value: img.insets[i], 'aria-label': '九宫格 ' + label,
      onchange: (e) => { const ins = img.insets.slice(); ins[i] = Math.max(0, Math.min(+e.target.value | 0, i % 2 ? hh : w)); img.insets = ins; draw(); changed(); } }));
    const demo = h('div', { class: 'ninebox' });
    box.append(
      h('div', { class: 'row' }, h('button', { type: 'button', onclick: async () => { const n = await chooseKeyImage(); if (n) set(n); } }, '换一张…'),
        h('span', { class: 'hint' }, `${w}×${hh} px · ${Math.ceil(S.files[img.file].length / 1024)} KB`)),
      h('div', { class: 'ninebox' }, ed, demo),
      h('div', { class: 'row' }, h('span', { class: 'k' }, '九宫格'), ...nums.map((n, i) => h('label', {}, ['左', '上', '右', '下'][i], n))),
      h('p', { class: 'hint' }, '虚线外的四角和四边不拉伸，中间拉伸；四条都在边上就是整张拉伸。'),
      h('div', { class: 'row' }, h('span', { class: 'k' }, '清晰度'),
        h('select', { 'aria-label': '每 dp 几个像素', onchange: (e) => { img.pxPerDp = +e.target.value; draw(); changed(); } },
          Array.from({ length: LIM.pxPerDp }, (_, i) => h('option', { value: i + 1, selected: img.pxPerDp === i + 1 }, `${i + 1} 像素 = 1 dp`))),
        h('span', { class: 'hint' }, '四角按这个比例画；图越大选越大')));
    draw();
    return box;
  }
  function demoKeys(img) {
    const d = density();
    const size = S.sizes[img.file];
    return [[80, 44], [36, 44]].map(([w, hh]) => {
      const svg = s('svg', { width: w + 8, height: hh + 8, viewBox: `-4 -4 ${w + 8} ${hh + 8}` });
      if (size) for (const p of L.nineSlice(size[0], size[1], img.insets, img.pxPerDp, [0, 0, w * d, hh * d], d)) {
        const [sl, st, sr, sb] = p.src;
        const [dl, dt, dr, db] = p.dst;
        if (sr <= sl || sb <= st || dr <= dl || db <= dt) continue;
        svg.append(s('svg', { x: dl / d, y: dt / d, width: (dr - dl) / d, height: (db - dt) / d, viewBox: `${sl} ${st} ${sr - sl} ${sb - st}`, preserveAspectRatio: 'none' },
          s('image', { href: S.urls[img.file], width: size[0], height: size[1] })));
      }
      return svg;
    });
  }

  /** KeyImageBudget per board, the default phone's portrait boards: what the app decodes for them. */

  async function darkCopy() {
    const T = clone(S.theme);
    const old = T.name;
    const name = uuid();
    // its own file names: the app deletes a theme's files with it, so two themes never share one
    const names = {};
    const files = {};
    const p = T.picture;
    for (const f of [...L.lookFiles(T), p && p.src].filter(Boolean)) {
      names[f] = f.startsWith(old + '-') ? name + f.slice(old.length) : name + '-' + f;
      if (S.files[f]) files[names[f]] = S.files[f];
    }
    const mapped = JSON.parse(JSON.stringify(T), (k, v) => (typeof v === 'string' && k !== 'name' && names[v] ? names[v] : v));
    mapped.name = name;
    mapped.isDark = true;
    for (const k of Object.keys(mapped.palette)) mapped.palette[k] = L.invertLightness(mapped.palette[k]);
    const manual = S.manual.slice();
    await setTheme(mapped, files);
    S.manual = manual;
    S.autoDark = false;
